<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Impact Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #E60012; margin-bottom: 12px; }
  .headline { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.0; letter-spacing: -2px; color: #1A1A16; text-align: center; margin-bottom: 60px; }

  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px; max-width: 1400px; }
  .stat-card { text-align: center; padding: 32px; background: #F5F5F5; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #E60012; }
  .stat-card .num { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 64px; line-height: 1; color: #1A1A16; letter-spacing: -3px; }
  .stat-card .num .red { color: #E60012; }
  .stat-card .unit { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-top: 8px; }
  .stat-card .label { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; color: #555; margin-top: 12px; }

  .bottom-bar { position: absolute; bottom: 60px; left: 0; right: 0; display: flex; justify-content: center; gap: 48px; }
  .bottom-bar .item { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #AAA; }
  .bottom-bar .item .red { color: #E60012; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="stats_summary" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="content">
        <div class="eyebrow">IMPACT · 2024 — 2026</div>
        <div class="headline">Every number tells a child's story.</div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="num" data-count="1284560">0</div>
            <div class="unit">CNY</div>
            <div class="label">累计捐赠金额</div>
          </div>
          <div class="stat-card">
            <div class="num" data-count="12431">0</div>
            <div class="unit">ARTWORKS</div>
            <div class="label">儿童画作投稿</div>
          </div>
          <div class="stat-card">
            <div class="num" data-count="4872">0</div>
            <div class="unit">CHILDREN</div>
            <div class="label">参与儿童人数</div>
          </div>
          <div class="stat-card">
            <div class="num" data-count="32">0</div>
            <div class="unit">SCHOOLS</div>
            <div class="label">合作乡村学校</div>
          </div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="item"><span class="red">98.7%</span> SUPPLY CHAIN TRACEABLE</div>
        <div class="item"><span class="red">4.5 KG</span> AVG CO₂ PER ITEM</div>
        <div class="item"><span class="red">28%</span> DONATION RATE</div>
        <div class="item"><span class="red">3</span> PLATFORMS</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["stats_summary"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.eyebrow', { y: -20, opacity: 0 });
      gsap.set('.headline', { y: 30, opacity: 0 });
      gsap.set('.stat-card', { y: 40, opacity: 0, scale: 0.9 });
      gsap.set('.bottom-bar .item', { y: 15, opacity: 0 });

      tl.to('.red-bar', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 0);
      tl.to('.eyebrow', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.2);
      tl.to('.headline', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.4);
      tl.to('.stat-card', { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.12, ease: 'back.out(1.2)' }, 0.8);

      // Counting animation
      document.querySelectorAll('.stat-card .num').forEach(el => {
        const target = parseInt(el.dataset.count);
        const obj = { val: 0 };
        tl.to(obj, {
          val: target,
          duration: 1.5,
          ease: 'power2.out',
          onUpdate: () => {
            el.textContent = Math.floor(obj.val).toLocaleString();
          }
        }, 1.0);
      });

      tl.to('.bottom-bar .item', { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: 'power2.out' }, 2.8);

      // Exit
      tl.to('.bottom-bar .item', { y: -10, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.stat-card', { y: -30, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power2.in' }, 4.3);
      tl.to('.headline', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.eyebrow', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 4.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
