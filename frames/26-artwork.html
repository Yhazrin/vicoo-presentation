<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Submit Artwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; left: 80px; right: 80px; top: 140px; bottom: 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }

  .left { display: flex; flex-direction: column; }
  .left .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .left h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 52px; line-height: 1.0; letter-spacing: -2px; color: #1A1A16; margin-top: 12px; }
  .left h1 em { font-style: normal; color: #E60012; }
  .left .body { font-family: 'Noto Sans SC', sans-serif; font-size: 18px; color: #555; margin-top: 24px; line-height: 1.7; max-width: 480px; }

  .form { margin-top: 32px; }
  .form .field { margin-bottom: 20px; }
  .form .field label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #888; display: block; margin-bottom: 8px; }
  .form .field input, .form .field textarea { width: 100%; padding: 14px 16px; border: 2px solid #E0E0E0; font-family: 'Inter', sans-serif; font-size: 14px; transition: border-color 0.3s ease; }
  .form .field input:focus, .form .field textarea:focus { border-color: #E60012; outline: none; }
  .form .field textarea { height: 100px; resize: none; }

  .consent { display: flex; gap: 12px; margin-top: 20px; padding: 16px; background: #F5F5F5; }
  .consent .icon { font-size: 24px; }
  .consent .text { font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: #666; line-height: 1.5; }
  .consent .text strong { color: #1A1A16; }

  .right { display: flex; flex-direction: column; }
  .right h3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; margin-bottom: 20px; }

  .dropzone { flex: 1; border: 3px dashed #E0E0E0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: all 0.3s ease; position: relative; overflow: hidden; }
  .dropzone .icon { font-size: 64px; }
  .dropzone .text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; color: #888; }
  .dropzone .sub { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: #AAA; }
  .dropzone .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,0,18,0.1), transparent); transform: translateX(-100%); }

  .btn { padding: 18px 32px; background: #E60012; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 20px; position: relative; overflow: hidden; }
  .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: translateX(-100%); }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="artwork" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">SUBMIT</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 21 · /submit</div>
      </div>

      <div class="content">
        <div class="left">
          <div class="kicker">CHAPTER 10 · SUBMIT ARTWORK</div>
          <h1>Every child can be a <em>designer</em>.</h1>
          <div class="body">上传孩子的画作，参与主题活动。优秀作品将被印在 VICOO 联名款上，让全世界看见。</div>

          <div class="form">
            <div class="field"><label>Artwork Title</label><input type="text" placeholder="我家的春天" disabled></div>
            <div class="field"><label>Child's Name</label><input type="text" placeholder="林一一" disabled></div>
            <div class="field"><label>Age</label><input type="text" placeholder="8" disabled></div>
            <div class="field"><label>Description</label><textarea placeholder="春天是彩色的，因为花开了，蝴蝶也来了。" disabled></textarea></div>
          </div>

          <div class="consent">
            <div class="icon">👨‍👩‍👧</div>
            <div class="text"><strong>Guardian Consent</strong>：家长同意将画作用于 VICOO 公益联名款设计，并确认画作为原创作品。</div>
          </div>
        </div>

        <div class="right">
          <h3>Upload Artwork</h3>
          <div class="dropzone">
            <div class="sweep"></div>
            <div class="icon">🎨</div>
            <div class="text">Drag & drop artwork here</div>
            <div class="sub">支持 JPG, PNG, PDF · 最大 10MB</div>
          </div>
          <button class="btn" disabled><div class="sweep"></div>SUBMIT ARTWORK →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["artwork"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.left .kicker', { y: 20, opacity: 0 });
      gsap.set('.left h1', { y: 30, opacity: 0 });
      gsap.set('.left .body', { y: 20, opacity: 0 });
      gsap.set('.form .field', { x: -20, opacity: 0 });
      gsap.set('.consent', { y: 20, opacity: 0 });
      gsap.set('.right h3', { y: 15, opacity: 0 });
      gsap.set('.dropzone', { y: 30, opacity: 0, scale: 0.95 });
      gsap.set('.dropzone .sweep', { x: '-100%' });
      gsap.set('.btn', { y: 20, opacity: 0 });
      gsap.set('.btn .sweep', { x: '-100%' });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 0.1);

      // Left content
      tl.to('.left .kicker', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.3);
      tl.to('.left h1', { y: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0.5);
      tl.to('.left .body', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.8);

      // Form fields — staggered slide
      tl.to('.form .field', { x: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'power3.out' }, 1.0);

      // Consent
      tl.to('.consent', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 1.5);

      // Right content
      tl.to('.right h3', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 1.2);
      tl.to('.dropzone', { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.2)' }, 1.4);

      // Dropzone sweep
      tl.to('.dropzone .sweep', { x: '100%', duration: 0.8, ease: 'power2.inOut' }, 2.0);

      // Button
      tl.to('.btn', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 2.2);
      tl.to('.btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.5);

      // Exit
      tl.to('.btn', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.2);
      tl.to('.dropzone', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.3);
      tl.to('.right h3', { y: -10, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.4);
      tl.to('.consent', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.3);
      tl.to('.form .field', { x: -15, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.4);
      tl.to('.left .body', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.left h1', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.left .kicker', { y: -10, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
