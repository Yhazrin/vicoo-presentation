<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Donation Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; overflow: hidden; }

  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E60012; transform: scaleX(0); transformOrigin: left; }

  /* Left: Donation form — faithful reproduction of DonationPanel component */
  .left { position: absolute; left: 0; top: 0; width: 55%; height: 100%; padding: 60px 80px; display: flex; flex-direction: column; justify-content: center; }

  .form-title {
    font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 32px; color: #FFFFFF;
    clip-path: inset(0 100% 0 0);
  }

  /* Amount presets — 2x2 grid, faithful to DonationPanel */
  .amounts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
  .amount {
    padding: 20px; text-align: center; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.03);
    transform: translateY(20px); opacity: 0;
    position: relative; overflow: hidden;
  }
  .amount.active { border-color: #E60012; background: rgba(230,0,18,0.08); }
  .amount .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; color: #FFFFFF; }
  .amount .label { font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
  .amount .currency { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
  /* Active indicator glow */
  .amount.active::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(230,0,18,0.15) 0%, transparent 70%);
  }

  /* Custom amount input */
  .custom-input {
    margin-top: 16px; padding: 14px 18px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.03);
    display: flex; align-items: center; gap: 12px;
    transform: translateY(15px); opacity: 0;
  }
  .custom-input .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; }
  .custom-input .value { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 20px; color: #FFFFFF; }

  /* Payment method selector — capsule pills */
  .payment-section { margin-top: 28px; }
  .payment-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; clip-path: inset(0 100% 0 0); }
  .payment-pills { display: flex; gap: 0; background: rgba(255,255,255,0.05); border-radius: 999px; padding: 4px; }
  .pill {
    padding: 10px 20px; border-radius: 999px;
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px;
    color: rgba(255,255,255,0.5); cursor: pointer;
    transform: translateX(-10px); opacity: 0;
  }
  .pill.active { background: rgba(230,0,18,0.15); color: #FFFFFF; font-weight: 700; }

  /* Submit button — MagneticButton style */
  .submit-btn {
    margin-top: 28px; width: 100%; padding: 18px;
    background: #E60012; color: #FFFFFF; border: 0;
    font-family: 'Inter', sans-serif; font-weight: 800; font-size: 15px;
    letter-spacing: 0.1em; text-transform: uppercase;
    transform: scaleX(0); transform-origin: left;
  }

  /* Right: Impact visualization */
  .right { position: absolute; right: 0; top: 0; width: 45%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; }

  /* ImpactCounter component — faithful reproduction */
  .impact-counter { text-align: center; margin-bottom: 40px; }
  .impact-counter .num {
    font-family: 'Inter', sans-serif; font-weight: 900; font-size: 96px;
    line-height: 1; color: #FFFFFF; letter-spacing: -4px;
    clip-path: inset(100% 0 0 0);
  }
  .impact-counter .label {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.5);
    margin-top: 8px; clip-path: inset(0 100% 0 0);
  }

  /* Impact breakdown — vertical bar chart */
  .impact-bars { width: 100%; max-width: 300px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bar-row .icon { font-size: 18px; width: 28px; text-align: center; }
  .bar-row .track { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: #E60012; border-radius: 4px; transform: scaleX(0); transform-origin: left; }
  .bar-row .pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #E60012; min-width: 40px; text-align: right; }
  .bar-row .name { font-family: 'Inter', sans-serif; font-size: 11px; color: rgba(255,255,255,0.5); min-width: 80px; }

  /* Selected tier description */
  .tier-desc {
    margin-top: 24px; padding: 16px 20px;
    border-left: 3px solid #E60012; background: rgba(255,255,255,0.03);
    font-family: 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.7);
    clip-path: inset(0 0 0 100%);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="donation_panel" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="left">
        <div class="form-title">选择捐赠金额</div>

        <div class="amounts">
          <div class="amount">
            <div class="val">¥50</div>
            <div class="label">1 套画笔</div>
            <div class="currency">CNY</div>
          </div>
          <div class="amount active">
            <div class="val">¥100</div>
            <div class="label">1 名学生 · 1 学期</div>
            <div class="currency">CNY</div>
          </div>
          <div class="amount">
            <div class="val">¥200</div>
            <div class="label">1 间画室改造</div>
            <div class="currency">CNY</div>
          </div>
          <div class="amount">
            <div class="val">¥500</div>
            <div class="label">1 位教师月薪</div>
            <div class="currency">CNY</div>
          </div>
        </div>

        <div class="custom-input">
          <div class="label">自定义金额</div>
          <div class="value">¥100</div>
        </div>

        <div class="payment-section">
          <div class="payment-label">支付方式</div>
          <div class="payment-pills">
            <div class="pill">Card / Stripe</div>
            <div class="pill active">WeChat Pay</div>
            <div class="pill">Alipay</div>
          </div>
        </div>

        <div class="submit-btn">立即捐赠 ♥</div>
      </div>

      <div class="right">
        <div class="impact-counter">
          <div class="num" id="totalDonated">0</div>
          <div class="label">TOTAL DONATED · CNY</div>
        </div>

        <div class="impact-bars">
          <div class="bar-row">
            <div class="icon">🎨</div>
            <div class="name">画材基金</div>
            <div class="track"><div class="fill" style="width: 60%;"></div></div>
            <div class="pct">60%</div>
          </div>
          <div class="bar-row">
            <div class="icon">🧵</div>
            <div class="name">生产成本</div>
            <div class="track"><div class="fill" style="width: 20%;"></div></div>
            <div class="pct">20%</div>
          </div>
          <div class="bar-row">
            <div class="icon">⚙️</div>
            <div class="name">运营费用</div>
            <div class="track"><div class="fill" style="width: 15%;"></div></div>
            <div class="pct">15%</div>
          </div>
          <div class="bar-row">
            <div class="icon">💝</div>
            <div class="name">社区建设</div>
            <div class="track"><div class="fill" style="width: 5%;"></div></div>
            <div class="pct">5%</div>
          </div>
        </div>

        <div class="tier-desc">
          ¥100 将为 1 名乡村学生提供 1 学期的美术用品，包括水彩颜料、画笔、画纸和画板。
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="../scripts/vfx-ambient.js"></script>
  <script>
    (function () {
      // === Particle background ===
      const page = document.querySelector('.page');
      VICOO_VFX.particles(page, {
        count: 25,
        color: '#E60012',
        maxSize: 1.8,
        speed: 0.12,
        connectDistance: 70,
        opacity: 0.18,
      });

      // === Glow pulse on impact counter ===
      const impactNum = document.querySelector('.impact-counter .num');
      if (impactNum) {
        setTimeout(() => VICOO_VFX.glowPulse(impactNum, { color: 'rgba(230,0,18,0.25)', size: 18, duration: 2.5 }), 1200);
      }

      // === Magnetic hover on amount buttons ===
      document.querySelectorAll('.amount').forEach(btn => {
        VICOO_VFX.magneticHover(btn, { strength: 0.15 });
      });

      // === Magnetic hover on submit button ===
      const submitBtn = document.querySelector('.submit-btn');
      if (submitBtn) VICOO_VFX.magneticHover(submitBtn, { strength: 0.2 });

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["donation_panel"] = tl;

      // === ACT 1: Red bar (0-0.3s) ===
      tl.to('.red-bar', { scaleX: 1, duration: 0.25, ease: 'power4.in' }, 0);

      // === ACT 2: Form title clips in (0.2-0.5s) ===
      tl.to('.form-title', { clipPath: 'inset(0 0% 0 0)', duration: 0.35, ease: 'power2.out' }, 0.2);

      // === ACT 3: Amount presets stagger in (0.4-1.2s) ===
      tl.to('.amount', { y: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'power2.out' }, 0.4);

      // Active amount pulse
      tl.to('.amount.active', { scale: 1.03, duration: 0.2, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 1.0);

      // === ACT 4: Custom input + payment pills (1.0-1.6s) ===
      tl.to('.custom-input', { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 1.0);
      tl.to('.payment-label', { clipPath: 'inset(0 0% 0 0)', duration: 0.3, ease: 'power2.out' }, 1.1);
      tl.to('.pill', { x: 0, opacity: 1, duration: 0.3, stagger: 0.06, ease: 'power2.out' }, 1.2);

      // === ACT 5: Submit button grows (1.5-1.8s) ===
      tl.to('.submit-btn', { scaleX: 1, duration: 0.4, ease: 'power3.out' }, 1.5);

      // === ACT 6: Right side — ImpactCounter reveals (1.0-2.5s) ===
      tl.to('.impact-counter .num', { clipPath: 'inset(0% 0 0 0)', duration: 0.6, ease: 'power3.inOut' }, 1.0);
      tl.to('.impact-counter .label', { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 1.4);

      // Counting animation
      const el = document.getElementById('totalDonated');
      const obj = { v: 0 };
      tl.to(obj, {
        v: 1284560, duration: 1.5, ease: 'power2.out',
        onUpdate: function() { el.textContent = Math.floor(obj.v).toLocaleString(); }
      }, 1.2);

      // === ACT 7: Impact bars grow (1.8-2.8s) ===
      tl.to('.bar-row .fill', { scaleX: 1, duration: 0.6, stagger: 0.1, ease: 'power2.out' }, 1.8);

      // === ACT 8: Tier description clips in (2.5-3.0s) ===
      tl.to('.tier-desc', { clipPath: 'inset(0 0 0 0%)', duration: 0.5, ease: 'power2.out' }, 2.5);

      // === EXIT ===
      tl.to('.tier-desc', { clipPath: 'inset(0 0 0 100%)', duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.bar-row .fill', { scaleX: 0, duration: 0.2, stagger: 0.03, ease: 'power2.in' }, 4.3);
      tl.to('.impact-counter .label', { clipPath: 'inset(0 100% 0 0)', duration: 0.2, ease: 'power2.in' }, 4.3);
      tl.to('.impact-counter .num', { clipPath: 'inset(0 0 100% 0)', duration: 0.3, ease: 'power3.in' }, 4.4);
      tl.to('.submit-btn', { scaleX: 0, transformOrigin: 'right', duration: 0.2, ease: 'power2.in' }, 4.3);
      tl.to('.pill', { x: 10, opacity: 0, duration: 0.2, stagger: 0.03, ease: 'power2.in' }, 4.3);
      tl.to('.payment-label', { clipPath: 'inset(0 0 0 100%)', duration: 0.2, ease: 'power2.in' }, 4.4);
      tl.to('.custom-input', { y: 10, opacity: 0, duration: 0.2, ease: 'power2.in' }, 4.4);
      tl.to('.amount', { y: 10, opacity: 0, duration: 0.2, stagger: 0.03, ease: 'power2.in' }, 4.4);
      tl.to('.form-title', { clipPath: 'inset(0 0 0 100%)', duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right', duration: 0.2, ease: 'power2.in' }, 4.6);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
