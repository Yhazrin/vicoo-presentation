<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Impact Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #E60012; margin-bottom: 12px; }
  .headline { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 56px; line-height: 1.0; letter-spacing: -2px; color: #FFFFFF; text-align: center; margin-bottom: 48px; }
  .headline .red { color: #E60012; }

  .impact-flow { display: flex; align-items: center; gap: 24px; max-width: 1400px; }
  .impact-step { flex: 1; padding: 28px; background: rgba(255,255,255,0.05); text-align: center; position: relative; overflow: hidden; }
  .impact-step::after { content: '→'; position: absolute; right: -20px; top: 50%; transform: translateY(-50%); font-size: 24px; color: #E60012; }
  .impact-step:last-child::after { display: none; }
  .impact-step .icon { font-size: 40px; margin-bottom: 12px; }
  .impact-step h3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
  .impact-step p { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 8px; line-height: 1.4; }
  .impact-step .amount { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 32px; color: #E60012; margin-top: 12px; }
  .impact-step .sweep { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(230,0,18,0.1) 0%, transparent 50%); opacity: 0; }

  .example { margin-top: 40px; padding: 24px 32px; background: rgba(255,255,255,0.05); border-left: 3px solid #E60012; max-width: 800px; }
  .example .title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #E60012; }
  .example .text { font-family: 'Noto Sans SC', sans-serif; font-size: 17px; color: rgba(255,255,255,0.8); margin-top: 8px; line-height: 1.5; }
  .example .text em { font-style: normal; color: #E60012; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="impact_preview" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="content">
        <div class="eyebrow">WHERE YOUR MONEY GOES</div>
        <div class="headline">Every <span class="red">¥100</span> you spend creates real impact.</div>

        <div class="impact-flow">
          <div class="impact-step">
            <div class="sweep"></div>
            <div class="icon">🛍️</div>
            <h3>You Buy</h3>
            <p>购买一件联名款</p>
            <div class="amount">¥178</div>
          </div>
          <div class="impact-step">
            <div class="sweep"></div>
            <div class="icon">💝</div>
            <h3>28% Donated</h3>
            <p>直接进入美育基金</p>
            <div class="amount">¥49.84</div>
          </div>
          <div class="impact-step">
            <div class="sweep"></div>
            <div class="icon">🎨</div>
            <h3>Art Supplies</h3>
            <p>为 1 名学生提供 1 学期画材</p>
            <div class="amount">1 Student</div>
          </div>
          <div class="impact-step">
            <div class="sweep"></div>
            <div class="icon">🏫</div>
            <h3>School Fund</h3>
            <p>支持驻校美育教师</p>
            <div class="amount">1 Semester</div>
          </div>
        </div>

        <div class="example">
          <div class="title">EXAMPLE · 林一一的「春的色彩」T 恤</div>
          <div class="text">售价 ¥178 → 捐赠 <em>¥49.84</em> → 为云南某小学提供 <em>1 套水彩画材</em> → 支持 <em>1 位驻校美育教师 1 个月</em></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["impact_preview"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.eyebrow', { y: -20, opacity: 0 });
      gsap.set('.headline', { y: 30, opacity: 0 });
      gsap.set('.impact-step', { y: 30, opacity: 0, scale: 0.9 });
      gsap.set('.impact-step .sweep', { opacity: 0 });
      gsap.set('.example', { y: 20, opacity: 0 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.eyebrow', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.2);
      tl.to('.headline', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.4);
      tl.to('.impact-step', { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.15, ease: 'back.out(1.2)' }, 0.8);

      // Sweep effect on steps
      tl.to('.impact-step .sweep', { opacity: 1, duration: 0.5, stagger: 0.1, ease: 'power2.out' }, 1.5);

      tl.to('.example', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.2);

      // Exit
      tl.to('.example', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.impact-step', { y: -25, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power2.in' }, 4.3);
      tl.to('.headline', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.eyebrow', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 4.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
