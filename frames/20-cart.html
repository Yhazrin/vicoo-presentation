<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Cart Drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }

  /* dimmed background simulating product page behind */
  .behind { position: absolute; left: 0; right: 0; top: 0; height: 88px; background: #E60012; display: flex; align-items: center; padding: 0 80px; }
  .behind .logo { display: flex; align-items: center; gap: 12px; color: #FFFFFF; }
  .behind .logo .mark { width: 40px; height: 40px; background: #FFFFFF; color: #E60012; display: flex; align-items: center; justify-content: center; font-family: 'Smiley Sans', sans-serif; font-size: 22px; }
  .behind .logo .name { font-family: 'Smiley Sans', sans-serif; font-size: 22px; }
  .behind .crumb { position: absolute; left: 80px; top: 110px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #888; }

  .dim { position: absolute; left: 0; right: 0; top: 88px; bottom: 0; background: rgba(0,0,0,0.4); }
  .dim .ghost { position: absolute; left: 80px; top: 60px; right: 60px; bottom: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; opacity: 0.3; }
  .dim .ghost .box { background: #F0EBE0; height: 100%; }

  /* Right drawer */
  .drawer { position: absolute; right: 0; top: 0; width: 700px; height: 1080px; background: #FFFFFF; display: flex; flex-direction: column; }
  .drawer .head { padding: 32px; border-bottom: 1px solid #EEE; display: flex; align-items: center; }
  .drawer .head h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 32px; }
  .drawer .head h1 .red { color: #E60012; }
  .drawer .head .count { margin-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #888; }
  .drawer .head .close { margin-left: auto; width: 36px; height: 36px; border: 1px solid #1A1A16; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; }
  .drawer .body { flex: 1; padding: 24px 32px; overflow-y: auto; }
  .drawer .item { display: grid; grid-template-columns: 100px 1fr auto; gap: 16px; padding: 20px 0; border-bottom: 1px solid #EEE; align-items: center; }
  .drawer .item .img { width: 100px; height: 130px; background: #F5F5F5; overflow: hidden; }
  .drawer .item .img img { width: 100%; height: 100%; object-fit: cover; }
  .drawer .item .info .name { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.3; }
  .drawer .item .info .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; margin-top: 6px; }
  .drawer .item .info .badge { display: inline-block; margin-top: 6px; padding: 2px 8px; background: #E60012; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; }
  .drawer .item .qty { display: flex; align-items: center; gap: 0; border: 1px solid #1A1A16; margin-top: 12px; }
  .drawer .item .qty button { width: 32px; height: 32px; background: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; }
  .drawer .item .qty .n { width: 40px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; border-left: 1px solid #1A1A16; border-right: 1px solid #1A1A16; }
  .drawer .item .price { text-align: right; }
  .drawer .item .price .v { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 22px; }
  .drawer .item .price .x { font-family: 'Inter', sans-serif; font-size: 11px; color: #888; margin-top: 4px; }

  .drawer .foot { padding: 24px 32px; border-top: 1px solid #EEE; background: #F5F5F5; }
  .drawer .foot .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-family: 'Inter', sans-serif; font-size: 14px; color: #555; }
  .drawer .foot .row strong { color: #1A1A16; font-weight: 700; }
  .drawer .foot .total { font-family: 'Smiley Sans', sans-serif; font-size: 32px; margin-top: 8px; }
  .drawer .foot .total .lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-right: 8px; }
  .drawer .foot .impact { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #FFF8E7; border: 1px solid #E60012; margin: 12px 0; font-family: 'Inter', sans-serif; font-size: 12px; color: #1A1A16; }
  .drawer .foot .impact .red { color: #E60012; font-weight: 700; }
  .drawer .foot .btn { width: 100%; height: 64px; background: #1A1A16; color: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.15em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="cart" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="behind">
        <div class="logo">
          <div class="mark">U</div>
          <div class="name">UNIQLO</div>
        </div>
      </div>
      <div class="crumb">SHOP <span style="color:#CCC;margin:0 8px">/</span> CART <span style="color:#E60012;margin-left:8px">● 3 ITEMS</span></div>
      <div class="dim">
        <div class="ghost">
          <div class="box"></div>
          <div class="box"></div>
        </div>
      </div>
      <div class="drawer">
        <div class="head">
          <h1>Cart <span class="red">/ 3</span></h1>
          <div class="count">items</div>
          <div class="close">×</div>
        </div>
        <div class="body">
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=200&q=80"/></div>
            <div class="info">
              <div class="name">春野·儿童画联名有机棉T恤</div>
              <div class="meta">SIZE 110 · WHITE</div>
              <div class="badge">28% DONATE</div>
              <div class="qty"><button>−</button><div class="n">1</div><button>+</button></div>
            </div>
            <div class="price"><div class="v">¥178</div><div class="x">× 1</div></div>
          </div>
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1597484662317-9bd7bdda2907?auto=format&fit=crop&w=200&q=80"/></div>
            <div class="info">
              <div class="name">云岭·公益插画帆布托特</div>
              <div class="meta">ONE SIZE · NATURAL</div>
              <div class="badge">25% DONATE</div>
              <div class="qty"><button>−</button><div class="n">1</div><button>+</button></div>
            </div>
            <div class="price"><div class="v">¥98</div><div class="x">× 1</div></div>
          </div>
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=200&q=80"/></div>
            <div class="info">
              <div class="name">再生羊毛混纺V领针织衫</div>
              <div class="meta">SIZE M · TAUPE</div>
              <div class="qty"><button>−</button><div class="n">1</div><button>+</button></div>
            </div>
            <div class="price"><div class="v">¥329</div><div class="x">× 1</div></div>
          </div>
        </div>
        <div class="foot">
          <div class="row"><span>Subtotal</span><strong>¥605</strong></div>
          <div class="row"><span>Shipping</span><strong>FREE</strong></div>
          <div class="row"><span>Estimated tax</span><strong>¥0</strong></div>
          <div class="total"><span class="lbl">TOTAL</span>¥605</div>
          <div class="impact">本订单将向美育基金捐赠 <span class="red">¥77</span>（12.7%）</div>
          <button class="btn">CHECKOUT →</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["cart"] = tl;
      gsap.set('.behind', { y: -88 });
      gsap.set('.dim, .crumb', { opacity: 0 });
      gsap.set('.drawer', { x: 700 });
      gsap.set('.drawer .item', { x: 30, opacity: 0 });
      gsap.set('.drawer .foot > *', { y: 20, opacity: 0 });
      tl.to('.behind', { y: 0, duration: 0.5, ease: 'power3.out' }, 0);
      tl.to('.dim, .crumb', { opacity: 1, duration: 0.4 }, 0.3);
      tl.to('.drawer', { x: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
      tl.to('.drawer .item', { x: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'power2.out' }, 0.6);
      tl.to('.drawer .foot > *', { y: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: 'power2.out' }, 1.0);
      // pulse the donate impact line
      tl.to({}, { duration: 0.3, onStart: () => {
        gsap.fromTo('.drawer .foot .impact', { scale: 1 }, { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1, ease: 'power2.inOut' });
      }}, 2.5);
      // Exit
      tl.to('.drawer .foot > *', { y: 20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 5.2);
      tl.to('.drawer .item', { x: 30, opacity: 0, duration: 0.3, ease: 'power2.in' }, 5.3);
      tl.to('.drawer', { x: 700, duration: 0.5, ease: 'power3.in' }, 5.4);
      tl.to('.dim, .crumb', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 5.5);
      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
