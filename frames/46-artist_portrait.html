<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Artist Portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; z-index: 10; }

  .left { background: #F5F0E8; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .left .artwork { width: 400px; height: 400px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 120px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); }
  .left .frame { position: absolute; width: 440px; height: 440px; border: 3px solid #1A1A16; pointer-events: none; }
  .left .label { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #888; }

  .right { display: flex; flex-direction: column; justify-content: center; padding: 80px; }
  .right .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .right h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 72px; line-height: 0.95; letter-spacing: -3px; color: #1A1A16; margin-top: 16px; }
  .right h1 em { font-style: normal; color: #E60012; }
  .right .age { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #888; margin-top: 8px; }
  .right .story { font-family: 'Noto Sans SC', sans-serif; font-size: 19px; line-height: 1.7; color: #555; margin-top: 24px; max-width: 480px; }
  .right .story em { font-style: normal; color: #E60012; font-weight: 700; }
  .right .quote { margin-top: 32px; padding: 20px 24px; background: #F5F5F5; border-left: 3px solid #E60012; font-family: 'Noto Sans SC', sans-serif; font-size: 18px; line-height: 1.6; color: #1A1A16; font-style: italic; max-width: 480px; }

  .product-link { display: inline-flex; align-items: center; gap: 12px; margin-top: 24px; padding: 14px 24px; background: #1A1A16; color: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.05em; position: relative; overflow: hidden; }
  .product-link .arrow { color: #E60012; }
  .product-link .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,0,18,0.3), transparent); transform: translateX(-100%); }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="artist_portrait" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="left">
        <div class="frame"></div>
        <div class="artwork">🌸</div>
        <div class="label">「春的色彩」· 2026</div>
      </div>
      <div class="right">
        <div class="kicker">THE ARTIST · 林一一</div>
        <h1>A child's <em>spring</em>, worn by everyone.</h1>
        <div class="age">AGE 8 · YUNNAN, CHINA</div>
        <div class="story">
          林一一画了春天——<em>黄色的花</em>、<em>绿色的叶</em>、<em>蓝色的天</em>。<br><br>
          她说：「春天是彩色的，因为花开了，蝴蝶也来了。」<br><br>
          这幅画现在印在了 VICOO × UNIQLO 联名 T 恤上，每售出一件，<em>28%</em> 直接捐赠给乡村美育基金。
        </div>
        <div class="quote">「我画的春天变成了真的衣服！我妈妈说要骄傲地穿出去。」</div>
        <div class="product-link"><div class="sweep"></div>VIEW THE PRODUCT <span class="arrow">→</span></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["artist_portrait"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.artwork', { scale: 0.8, opacity: 0, rotation: -5 });
      gsap.set('.frame', { scale: 0.9, opacity: 0 });
      gsap.set('.label', { y: 20, opacity: 0 });
      gsap.set('.right .kicker', { y: 20, opacity: 0 });
      gsap.set('.right h1', { y: 30, opacity: 0 });
      gsap.set('.right .age', { opacity: 0 });
      gsap.set('.right .story', { y: 20, opacity: 0 });
      gsap.set('.right .quote', { x: -20, opacity: 0 });
      gsap.set('.product-link', { y: 20, opacity: 0 });
      gsap.set('.product-link .sweep', { x: '-100%' });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 0);
      tl.to('.artwork', { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: 'back.out(1.4)' }, 0.3);
      tl.to('.frame', { scale: 1, opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.5);
      tl.to('.label', { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 0.8);
      tl.to('.right .kicker', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.5);
      tl.to('.right h1', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.7);
      tl.to('.right .age', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.0);
      tl.to('.right .story', { y: 0, opacity: 1, duration: 0.6, ease: 'power2.out' }, 1.2);
      tl.to('.right .quote', { x: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 1.8);
      tl.to('.product-link', { y: 0, opacity: 1, duration: 0.4, ease: 'power2.out' }, 2.2);
      tl.to('.product-link .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.5);

      // Exit
      tl.to('.product-link', { y: -10, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.right .quote', { x: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.3);
      tl.to('.right .story', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.3);
      tl.to('.right h1', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.4);
      tl.to('.right .kicker', { y: -10, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.4);
      tl.to('.artwork', { scale: 0.8, opacity: 0, duration: 0.4, ease: 'power2.in' }, 4.3);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 4.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
