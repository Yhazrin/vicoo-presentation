<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; display: flex; }

  .left { width: 700px; background: #0A0A0A; color: #FFFFFF; padding: 80px 64px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
  .left .top-bar { display: flex; align-items: center; gap: 12px; }
  .left .top-bar .mark { width: 40px; height: 40px; background: #E60012; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Smiley Sans', sans-serif; font-size: 22px; }
  .left .top-bar .name { font-family: 'Smiley Sans', sans-serif; font-size: 22px; }

  .left .hero { margin-top: 80px; }
  .left .hero h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 72px; line-height: 0.95; letter-spacing: -3px; }
  .left .hero h1 em { font-style: normal; color: #E60012; }
  .left .hero .sub { font-family: 'Noto Sans SC', sans-serif; font-size: 18px; color: rgba(255,255,255,0.6); margin-top: 24px; line-height: 1.6; }

  .left .stats { display: flex; gap: 32px; margin-bottom: 40px; }
  .left .stats .stat { text-align: center; }
  .left .stats .stat .num { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; color: #E60012; }
  .left .stats .stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

  .left .deco { position: absolute; bottom: 0; right: 0; width: 200px; height: 200px; border-radius: 50%; border: 2px solid rgba(230,0,18,0.3); transform: translate(30%, 30%); }

  .right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px; }
  .right .form { width: 100%; max-width: 440px; }
  .right .form .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .right .form h2 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 32px; margin-top: 12px; }
  .right .form .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: #888; margin-top: 8px; }

  .right .form .field { margin-top: 24px; }
  .right .form .field label { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #888; display: block; margin-bottom: 8px; }
  .right .form .field input { width: 100%; padding: 16px 20px; border: 2px solid #E0E0E0; font-family: 'Inter', sans-serif; font-size: 15px; transition: border-color 0.3s ease; }
  .right .form .field input:focus { border-color: #E60012; outline: none; }
  .right .form .field input::placeholder { color: #CCC; }

  .right .form .forgot { text-align: right; margin-top: 8px; }
  .right .form .forgot a { font-family: 'Inter', sans-serif; font-size: 13px; color: #E60012; text-decoration: none; }

  .right .form .btn { width: 100%; padding: 18px; background: #E60012; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 24px; position: relative; overflow: hidden; }
  .right .form .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: translateX(-100%); }

  .right .form .divider { display: flex; align-items: center; gap: 16px; margin-top: 24px; }
  .right .form .divider .line { flex: 1; height: 1px; background: #E0E0E0; }
  .right .form .divider .text { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; }

  .right .form .social { display: flex; gap: 12px; margin-top: 16px; }
  .right .form .social .btn-social { flex: 1; padding: 14px; border: 2px solid #E0E0E0; background: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

  .right .form .signup { text-align: center; margin-top: 24px; font-family: 'Inter', sans-serif; font-size: 14px; color: #888; }
  .right .form .signup a { color: #E60012; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="login" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="left">
        <div class="top-bar">
          <div class="mark">V</div>
          <div class="name">VICOO</div>
        </div>
        <div class="hero">
          <h1>Hello,<br><em>again.</em></h1>
          <p class="sub">登录您的 VICOO 账户，追踪订单、管理捐赠、参与投票——一切从这里开始。</p>
        </div>
        <div class="stats">
          <div class="stat"><div class="num">12,431</div><div class="lbl">Artworks</div></div>
          <div class="stat"><div class="num">4,872</div><div class="lbl">Children</div></div>
          <div class="stat"><div class="num">¥1.28M</div><div class="lbl">Donated</div></div>
        </div>
        <div class="deco"></div>
      </div>

      <div class="right">
        <div class="form">
          <div class="kicker">WELCOME BACK</div>
          <h2>Sign in to your account</h2>
          <p class="desc">输入您的邮箱和密码继续</p>

          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="lihua@example.com" disabled>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" placeholder="••••••••" disabled>
          </div>
          <div class="forgot"><a href="#">Forgot password?</a></div>

          <button class="btn" disabled><div class="sweep"></div>SIGN IN →</button>

          <div class="divider">
            <div class="line"></div>
            <div class="text">OR</div>
            <div class="line"></div>
          </div>

          <div class="social">
            <button class="btn-social" disabled>💬 WeChat</button>
            <button class="btn-social" disabled>🔵 Alipay</button>
          </div>

          <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["login"] = tl;

      gsap.set('.left', { x: -700, opacity: 0 });
      gsap.set('.left .top-bar', { y: -20, opacity: 0 });
      gsap.set('.left .hero h1', { y: 40, opacity: 0 });
      gsap.set('.left .hero .sub', { y: 20, opacity: 0 });
      gsap.set('.left .stats .stat', { y: 20, opacity: 0 });
      gsap.set('.left .deco', { scale: 0, opacity: 0 });
      gsap.set('.right .form > *', { y: 20, opacity: 0 });
      gsap.set('.right .form .btn .sweep', { x: '-100%' });
      gsap.set('.right .form .field input', { borderColor: '#E0E0E0' });

      // Entry — left panel slides in
      tl.to('.left', { x: 0, opacity: 1, duration: 0.8, ease: 'power3.out' }, 0);

      // Left content
      tl.to('.left .top-bar', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.3);
      tl.to('.left .hero h1', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.5);
      tl.to('.left .hero .sub', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.8);
      tl.to('.left .stats .stat', { y: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'back.out(1.4)' }, 1.0);
      tl.to('.left .deco', { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.2)' }, 1.2);

      // Right form
      tl.to('.right .form > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 0.5);

      // Input focus animation
      tl.to('.right .form .field input', { borderColor: '#E60012', duration: 0.3, stagger: 0.1, ease: 'power2.out' }, 1.5);

      // Button sweep
      tl.to('.right .form .btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.0);

      // Exit
      tl.to('.right .form > *', { y: -15, opacity: 0, duration: 0.3, stagger: 0.04, ease: 'power3.in' }, 4.2);
      tl.to('.left', { x: -700, opacity: 0, duration: 0.5, ease: 'power3.in' }, 4.3);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
