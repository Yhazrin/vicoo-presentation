<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Certificate Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #F5F0E8; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

  .cert { width: 700px; padding: 60px; background: #FFFFFF; box-shadow: 0 20px 60px rgba(0,0,0,0.1); position: relative; }
  .cert .border { position: absolute; inset: 12px; border: 2px solid #E60012; pointer-events: none; }
  .cert .corner-mark { position: absolute; width: 24px; height: 24px; }
  .cert .corner-mark.tl { top: 8px; left: 8px; border-top: 3px solid #E60012; border-left: 3px solid #E60012; }
  .cert .corner-mark.tr { top: 8px; right: 8px; border-top: 3px solid #E60012; border-right: 3px solid #E60012; }
  .cert .corner-mark.bl { bottom: 8px; left: 8px; border-bottom: 3px solid #E60012; border-left: 3px solid #E60012; }
  .cert .corner-mark.br { bottom: 8px; right: 8px; border-bottom: 3px solid #E60012; border-right: 3px solid #E60012; }

  .cert .header { text-align: center; margin-bottom: 32px; }
  .cert .header .logo { font-family: 'Smiley Sans', sans-serif; font-size: 48px; color: #E60012; }
  .cert .header .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: #888; margin-top: 8px; }

  .cert .body { text-align: center; }
  .cert .body .label { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .cert .body .name { font-family: 'Smiley Sans', sans-serif; font-size: 36px; color: #1A1A16; margin-top: 8px; }
  .cert .body .amount { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 56px; color: #E60012; margin-top: 16px; }
  .cert .body .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; color: #555; margin-top: 16px; line-height: 1.6; }

  .cert .footer { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 20px; border-top: 1px solid #E0E0E0; }
  .cert .footer .item .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #888; }
  .cert .footer .item .value { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; margin-top: 4px; }

  .cert .stamp { position: absolute; top: 40px; right: 40px; width: 80px; height: 80px; border: 3px solid #E60012; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(-15deg); }
  .cert .stamp .text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 12px; color: #E60012; text-align: center; line-height: 1.2; }

  .actions { display: flex; gap: 16px; margin-top: 32px; justify-content: center; }
  .actions .btn { padding: 14px 24px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; }
  .actions .btn.primary { background: #E60012; color: #FFFFFF; }
  .actions .btn.ghost { border: 2px solid #1A1A16; color: #1A1A16; background: transparent; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="certificate_detail" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="cert">
        <div class="border"></div>
        <div class="corner-mark tl"></div>
        <div class="corner-mark tr"></div>
        <div class="corner-mark bl"></div>
        <div class="corner-mark br"></div>

        <div class="stamp"><div class="text">TRUE<br>VERIFIED</div></div>

        <div class="header">
          <div class="logo">VICOO</div>
          <div class="title">DONATION CERTIFICATE</div>
        </div>

        <div class="body">
          <div class="label">CERTIFICATE NO.</div>
          <div class="name">VC-2026Q2-128456-SH</div>
          <div class="amount">¥49.84</div>
          <div class="desc">感谢您购买「春的色彩」联名 T 恤。<br>本订单 28% 的销售额（¥49.84）已捐赠至<br>「乡村儿童画材与驻校美育基金」。</div>
        </div>

        <div class="footer">
          <div class="item"><div class="label">DONOR</div><div class="value">朱莉华</div></div>
          <div class="item"><div class="label">DATE</div><div class="value">2026-04-20</div></div>
          <div class="item"><div class="label">CAMPAIGN</div><div class="value">春的色彩</div></div>
          <div class="item"><div class="label">SCHOOL</div><div class="value">云南某小学</div></div>
        </div>
      </div>

      <div class="actions">
        <div class="btn primary">DOWNLOAD PDF</div>
        <div class="btn ghost">SHARE</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["certificate_detail"] = tl;

      gsap.set('.cert', { y: 40, opacity: 0, scale: 0.95 });
      gsap.set('.cert .border', { opacity: 0 });
      gsap.set('.cert .corner-mark', { scale: 0 });
      gsap.set('.cert .stamp', { scale: 0, rotation: -45 });
      gsap.set('.cert .header > *', { y: 20, opacity: 0 });
      gsap.set('.cert .body > *', { y: 20, opacity: 0 });
      gsap.set('.cert .footer .item', { y: 15, opacity: 0 });
      gsap.set('.actions .btn', { y: 20, opacity: 0 });

      tl.to('.cert', { y: 0, opacity: 1, scale: 1, duration: 0.8, ease: 'power3.out' }, 0);
      tl.to('.cert .border', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.3);
      tl.to('.cert .corner-mark', { scale: 1, duration: 0.4, stagger: 0.08, ease: 'back.out(1.4)' }, 0.5);
      tl.to('.cert .stamp', { scale: 1, rotation: -15, duration: 0.6, ease: 'back.out(1.4)' }, 0.8);
      tl.to('.cert .header > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.1, ease: 'power2.out' }, 0.6);
      tl.to('.cert .body > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.1, ease: 'power2.out' }, 1.0);
      tl.to('.cert .footer .item', { y: 0, opacity: 1, duration: 0.4, stagger: 0.08, ease: 'power2.out' }, 2.0);
      tl.to('.actions .btn', { y: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'power2.out' }, 2.5);

      // Stamp pulse
      tl.to('.cert .stamp', { scale: 1.1, duration: 0.3, yoyo: true, repeat: 1, ease: 'power2.inOut' }, 3.0);

      // Exit
      tl.to('.actions .btn', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.cert', { y: -30, opacity: 0, scale: 0.95, duration: 0.4, ease: 'power2.in' }, 4.3);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
