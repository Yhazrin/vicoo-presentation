<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Impact Counters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; overflow: hidden; }

  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E60012; transform: scaleX(0); transform-origin: left; }

  /* The big headline */
  .headline {
    position: absolute; left: 0; right: 0; top: 80px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.3em; text-transform: uppercase; color: #E60012;
    clip-path: inset(0 100% 0 0);
  }

  /* Three counter cards — staggered reveal */
  .counters { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; gap: 80px; }
  .counter { text-align: center; position: relative; }
  .counter .num {
    font-family: 'Inter', sans-serif; font-weight: 900; font-size: 100px;
    line-height: 1; color: #FFFFFF; letter-spacing: -4px;
    /* clipPath reveal: wipe from bottom */
    clip-path: inset(100% 0 0 0);
  }
  .counter .unit {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.5);
    margin-top: 8px; clip-path: inset(0 100% 0 0);
  }
  .counter .label {
    font-family: 'Noto Sans SC', sans-serif; font-size: 16px; color: rgba(255,255,255,0.4);
    margin-top: 8px; clip-path: inset(0 0 0 100%);
  }
  /* Red accent line under each counter */
  .counter .accent { width: 60px; height: 3px; background: #E60012; margin: 16px auto 0; transform: scaleX(0); }

  /* Bottom stats bar */
  .bottom-bar {
    position: absolute; bottom: 60px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 40px;
  }
  .bottom-bar .item {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.15em; text-transform: uppercase; color: #555;
    clip-path: inset(0 100% 0 0);
  }
  .bottom-bar .item .red { color: #E60012; font-weight: 700; }

  /* Decorative horizontal rules */
  .h-rule { position: absolute; left: 50%; height: 1px; background: rgba(255,255,255,0.06); transform: translateX(-50%); width: 0; }
  .h-rule.top { top: 140px; }
  .h-rule.bot { bottom: 120px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="counters_burst" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="h-rule top"></div>
      <div class="h-rule bot"></div>

      <div class="headline">REAL IMPACT · REAL NUMBERS</div>

      <div class="counters">
        <div class="counter">
          <div class="num" id="n1">0</div>
          <div class="unit">CNY DONATED</div>
          <div class="label">累计捐赠</div>
          <div class="accent"></div>
        </div>
        <div class="counter">
          <div class="num" id="n2">0</div>
          <div class="unit">ARTWORKS</div>
          <div class="label">儿童画作</div>
          <div class="accent"></div>
        </div>
        <div class="counter">
          <div class="num" id="n3">0</div>
          <div class="unit">CHILDREN</div>
          <div class="label">参与儿童</div>
          <div class="accent"></div>
        </div>
      </div>

      <div class="bottom-bar">
        <div class="item"><span class="red">32</span> SCHOOLS</div>
        <div class="item"><span class="red">98.7%</span> TRACEABLE</div>
        <div class="item"><span class="red">4.5 KG</span> AVG CO₂</div>
        <div class="item"><span class="red">28%</span> DONATION RATE</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["counters_burst"] = tl;

      // === ACT 1: Red bar + horizontal rules (0-0.4s) ===
      tl.to('.red-bar', { scaleX: 1, duration: 0.25, ease: 'power4.in' }, 0);
      tl.to('.h-rule.top', { width: 800, duration: 0.4, ease: 'power2.out' }, 0.15);
      tl.to('.h-rule.bot', { width: 600, duration: 0.4, ease: 'power2.out' }, 0.25);

      // === ACT 2: Headline clips in (0.3-0.6s) ===
      tl.to('.headline', { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 0.3);

      // === ACT 3: Counter numbers rise from bottom with clipPath (0.5-1.2s) ===
      tl.to('.counter:nth-child(1) .num', { clipPath: 'inset(0% 0 0 0)', duration: 0.5, ease: 'power3.inOut' }, 0.5);
      tl.to('.counter:nth-child(2) .num', { clipPath: 'inset(0% 0 0 0)', duration: 0.5, ease: 'power3.inOut' }, 0.7);
      tl.to('.counter:nth-child(3) .num', { clipPath: 'inset(0% 0 0 0)', duration: 0.5, ease: 'power3.inOut' }, 0.9);

      // Unit labels clip from left
      tl.to('.counter .unit', { clipPath: 'inset(0 0% 0 0)', duration: 0.3, stagger: 0.1, ease: 'power2.out' }, 1.0);

      // Labels clip from right
      tl.to('.counter .label', { clipPath: 'inset(0 0 0 0%)', duration: 0.3, stagger: 0.1, ease: 'power2.out' }, 1.2);

      // Accent lines expand from center
      tl.to('.counter .accent', { scaleX: 1, duration: 0.3, stagger: 0.1, ease: 'power3.out' }, 1.4);

      // === ACT 4: Counting animation (1.0-2.5s) ===
      const n1 = document.getElementById('n1');
      const n2 = document.getElementById('n2');
      const n3 = document.getElementById('n3');
      const o1 = { v: 0 }, o2 = { v: 0 }, o3 = { v: 0 };

      tl.to(o1, { v: 1284560, duration: 1.5, ease: 'power2.out', onUpdate: function() {
        n1.textContent = Math.floor(o1.v).toLocaleString();
      }}, 1.0);
      tl.to(o2, { v: 12431, duration: 1.3, ease: 'power2.out', onUpdate: function() {
        n2.textContent = Math.floor(o2.v).toLocaleString();
      }}, 1.2);
      tl.to(o3, { v: 4872, duration: 1.1, ease: 'power2.out', onUpdate: function() {
        n3.textContent = Math.floor(o3.v).toLocaleString();
      }}, 1.4);

      // === ACT 5: Bottom bar clips in (2.2-2.8s) ===
      tl.to('.bottom-bar .item', { clipPath: 'inset(0 0% 0 0)', duration: 0.3, stagger: 0.08, ease: 'power2.out' }, 2.2);

      // === EXIT ===
      tl.to('.bottom-bar .item', { clipPath: 'inset(0 0 0 100%)', duration: 0.2, stagger: 0.03, ease: 'power2.in' }, 3.2);
      tl.to('.counter .accent', { scaleX: 0, duration: 0.2, ease: 'power2.in' }, 3.3);
      tl.to('.counter .label', { clipPath: 'inset(0 0 0 100%)', duration: 0.2, ease: 'power2.in' }, 3.3);
      tl.to('.counter .unit', { clipPath: 'inset(0 100% 0 0)', duration: 0.2, ease: 'power2.in' }, 3.4);
      tl.to('.counter .num', { clipPath: 'inset(0 0 100% 0)', duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 3.4);
      tl.to('.headline', { clipPath: 'inset(0 0 0 100%)', duration: 0.3, ease: 'power2.in' }, 3.6);
      tl.to('.h-rule', { width: 0, duration: 0.2, ease: 'power2.in' }, 3.6);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right', duration: 0.2, ease: 'power2.in' }, 3.7);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
