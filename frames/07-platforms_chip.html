<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Three Platforms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #E60012; margin-bottom: 16px; }
  .headline { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.0; letter-spacing: -2px; color: #1A1A16; text-align: center; margin-bottom: 48px; }
  .headline em { font-style: normal; color: #E60012; }

  .platforms { display: flex; gap: 32px; max-width: 1200px; }
  .platform { flex: 1; padding: 40px; background: #F5F5F5; text-align: center; position: relative; overflow: hidden; transition: all 0.3s ease; }
  .platform::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #E60012; transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease; }
  .platform:hover::before { transform: scaleX(1); }
  .platform .icon { font-size: 56px; margin-bottom: 20px; }
  .platform h3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase; }
  .platform .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; color: #666; margin-top: 12px; line-height: 1.5; }
  .platform .stats { display: flex; justify-content: center; gap: 24px; margin-top: 20px; }
  .platform .stats .stat { text-align: center; }
  .platform .stats .stat .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; color: #E60012; }
  .platform .stats .stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
  .platform .sweep { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(230,0,18,0.1) 0%, transparent 50%); opacity: 0; transition: opacity 0.3s ease; }
  .platform:hover .sweep { opacity: 1; }
  .platform .badge { position: absolute; top: 16px; right: 16px; background: #E60012; color: #FFFFFF; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; opacity: 0; transform: scale(0.8); transition: all 0.3s ease; }
  .platform:hover .badge { opacity: 1; transform: scale(1); }

  .divider { width: 80px; height: 2px; background: rgba(230,0,18,0.3); margin-top: 48px; }
  .closing { font-family: 'Noto Sans SC', sans-serif; font-size: 20px; color: #888; margin-top: 24px; text-align: center; }
  .closing em { font-style: normal; color: #E60012; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="platforms_chip" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="content">
        <div class="eyebrow">THREE PLATFORMS</div>
        <div class="headline">One <em>mission</em>, three ways to access.</div>

        <div class="platforms">
          <div class="platform">
            <div class="sweep"></div>
            <div class="badge">WEB</div>
            <div class="icon">🌐</div>
            <h3>React Web</h3>
            <div class="desc">1990s 编辑杂志美学，沉浸式浏览体验</div>
            <div class="stats">
              <div class="stat"><div class="val">1,284</div><div class="lbl">Products</div></div>
              <div class="stat"><div class="val">4,872</div><div class="lbl">Users</div></div>
            </div>
          </div>
          <div class="platform">
            <div class="sweep"></div>
            <div class="badge">WECHAT</div>
            <div class="icon">💬</div>
            <h3>WeChat Mini</h3>
            <div class="desc">微信小程序，扫码即用，无需下载</div>
            <div class="stats">
              <div class="stat"><div class="val">8,234</div><div class="lbl">Users</div></div>
              <div class="stat"><div class="val">92%</div><div class="lbl">Retention</div></div>
            </div>
          </div>
          <div class="platform">
            <div class="sweep"></div>
            <div class="badge">ANDROID</div>
            <div class="icon">📱</div>
            <h3>Android App</h3>
            <div class="desc">原生体验，Kotlin + Jetpack Compose</div>
            <div class="stats">
              <div class="stat"><div class="val">3,456</div><div class="lbl">Downloads</div></div>
              <div class="stat"><div class="val">4.8★</div><div class="lbl">Rating</div></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="closing">三个平台，<em>同一个使命</em>——让每个孩子的画被世界看见。</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["platforms_chip"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.eyebrow', { y: -20, opacity: 0 });
      gsap.set('.headline', { y: 30, opacity: 0 });
      gsap.set('.platform', { y: 40, opacity: 0, scale: 0.9 });
      gsap.set('.platform::before', { scaleX: 0 });
      gsap.set('.divider', { scaleX: 0, transformOrigin: 'center' });
      gsap.set('.closing', { y: 20, opacity: 0 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.eyebrow', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.2);
      tl.to('.headline', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.4);

      // Platforms — staggered pop with scale
      tl.to('.platform', { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.15, ease: 'back.out(1.4)' }, 0.8);

      // Top bar wipe on each platform
      tl.to('.platform::before', { scaleX: 1, duration: 0.4, stagger: 0.1, ease: 'power3.inOut' }, 1.2);

      // Divider
      tl.to('.divider', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 1.8);

      // Closing
      tl.to('.closing', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 2.0);

      // Exit
      tl.to('.closing', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 3.2);
      tl.to('.divider', { scaleX: 0, duration: 0.2, ease: 'power3.in' }, 3.3);
      tl.to('.platform', { y: -30, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 3.3);
      tl.to('.headline', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 3.5);
      tl.to('.eyebrow', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 3.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 3.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
