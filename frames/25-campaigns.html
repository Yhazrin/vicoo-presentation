<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; left: 80px; right: 80px; top: 140px; bottom: 80px; }

  .featured { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px; }
  .featured .visual { background: #F5F0E8; height: 320px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .featured .visual .icon { font-size: 80px; }
  .featured .visual .badge { position: absolute; top: 20px; right: 20px; background: #E60012; color: #FFFFFF; padding: 8px 14px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 12px; }
  .featured .info { display: flex; flex-direction: column; justify-content: center; }
  .featured .info .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .featured .info h2 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 48px; line-height: 1.0; letter-spacing: -2px; margin-top: 12px; }
  .featured .info h2 em { font-style: normal; color: #E60012; }
  .featured .info .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; color: #555; margin-top: 16px; line-height: 1.6; }
  .featured .info .progress { margin-top: 20px; }
  .featured .info .progress .bar { height: 8px; background: #F0F0F0; overflow: hidden; }
  .featured .info .progress .fill { height: 100%; background: #E60012; width: 0; }
  .featured .info .progress .labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .featured .info .progress .labels span { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: #F5F5F5; overflow: hidden; position: relative; }
  .card .img { height: 200px; background: #E0E0E0; display: flex; align-items: center; justify-content: center; font-size: 48px; }
  .card .info { padding: 20px; }
  .card .info .name { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 16px; }
  .card .info .progress { margin-top: 12px; }
  .card .info .progress .bar { height: 6px; background: #E0E0E0; }
  .card .info .progress .fill { height: 100%; background: #E60012; }
  .card .info .progress .labels { display: flex; justify-content: space-between; margin-top: 6px; }
  .card .info .progress .labels span { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #888; }
  .card .badge { position: absolute; top: 12px; right: 12px; background: #E60012; color: #FFFFFF; padding: 6px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="campaigns" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">CAMPAIGNS</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 20 · /campaigns</div>
      </div>

      <div class="content">
        <div class="featured">
          <div class="visual">
            <div class="icon">🌸</div>
            <div class="badge">FEATURED</div>
          </div>
          <div class="info">
            <div class="kicker">SPRING 2026</div>
            <h2>「<em>春的色彩</em>」</h2>
            <div class="desc">春季主题画作征集活动。孩子们画出心中的春天，优秀作品将被印在 VICOO × UNIQLO 联名款上。</div>
            <div class="progress">
              <div class="bar"><div class="fill" style="width: 0%;"></div></div>
              <div class="labels"><span>200 / 500 件</span><span>40% · 87% ON TRACK</span></div>
            </div>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <div class="img">🎨</div>
            <div class="info">
              <div class="name">夏日阳光</div>
              <div class="progress">
                <div class="bar"><div class="fill" style="width: 65%;"></div></div>
                <div class="labels"><span>325 / 500</span><span>65%</span></div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="img">🍂</div>
            <div class="info">
              <div class="name">秋的收获</div>
              <div class="progress">
                <div class="bar"><div class="fill" style="width: 30%;"></div></div>
                <div class="labels"><span>150 / 500</span><span>30%</span></div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="img">❄️</div>
            <div class="info">
              <div class="name">冬日温暖</div>
              <div class="progress">
                <div class="bar"><div class="fill" style="width: 10%;"></div></div>
                <div class="labels"><span>50 / 500</span><span>10%</span></div>
              </div>
            </div>
            <div class="badge">NEW</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["campaigns"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.featured .visual', { clipPath: 'inset(0 100% 0 0)', opacity: 0 });
      gsap.set('.featured .visual .icon', { scale: 0.5, opacity: 0 });
      gsap.set('.featured .visual .badge', { scale: 0, rotation: -45 });
      gsap.set('.featured .info > *', { y: 20, opacity: 0 });
      gsap.set('.featured .info .progress .fill', { scaleX: 0, transformOrigin: 'left' });
      gsap.set('.card', { y: 30, opacity: 0, scale: 0.95 });
      gsap.set('.card .progress .fill', { scaleX: 0, transformOrigin: 'left' });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 0.1);

      // Featured section
      tl.to('.featured .visual', { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 0.8, ease: 'power3.inOut' }, 0.3);
      tl.to('.featured .visual .icon', { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.4)' }, 0.6);
      tl.to('.featured .visual .badge', { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(2)' }, 0.8);
      tl.to('.featured .info > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.1, ease: 'power3.out' }, 0.5);

      // Featured progress bar
      tl.to('.featured .info .progress .fill', { scaleX: 1, duration: 1.0, ease: 'power3.inOut' }, 1.2);

      // Cards — staggered reveal
      tl.to('.card', { y: 0, opacity: 1, scale: 1, duration: 0.5, stagger: 0.12, ease: 'back.out(1.2)' }, 1.5);

      // Card progress bars
      tl.to('.card .progress .fill', { scaleX: 1, duration: 0.8, stagger: 0.1, ease: 'power3.inOut' }, 2.0);

      // Exit
      tl.to('.card', { y: -20, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.2);
      tl.to('.featured .info > *', { y: -15, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.3);
      tl.to('.featured .visual', { clipPath: 'inset(0 0 0 100%)', opacity: 0, duration: 0.5, ease: 'power3.in' }, 5.4);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
