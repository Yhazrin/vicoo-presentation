<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; overflow: hidden; }

  /* === LAYER 1: The wordmark === */
  .wordmark { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-55%); text-align: center; }
  .wordmark .word {
    font-family: 'Smiley Sans', 'Inter', sans-serif;
    font-size: 480px; line-height: 0.82; letter-spacing: -24px;
    color: #FFFFFF; font-weight: 400;
    /* clip-path reveal: wipe from left */
    clip-path: inset(0 100% 0 0);
  }

  /* Each letter for per-letter 3D rotation */
  .wordmark .word .letter {
    display: inline-block;
    transform-origin: center bottom;
    opacity: 0;
  }

  /* === LAYER 2: The red line === */
  .red-line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 6px; background: #E60012;
    transform: scaleX(0); transform-origin: left center;
    box-shadow: 0 0 30px rgba(230,0,18,0.6);
  }

  /* === LAYER 3: Tagline — typed character by character === */
  .tagline {
    position: absolute; left: 0; right: 0; bottom: 140px; text-align: center;
    font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500;
    letter-spacing: 0.5em; text-transform: uppercase; color: #FFFFFF;
  }
  .tagline .char { display: inline-block; opacity: 0; }

  /* === LAYER 4: Corner marks — clipPath reveal === */
  .corner {
    position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 13px;
    font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #666;
    clip-path: inset(0 100% 0 0);
  }
  .corner.tl { top: 40px; left: 64px; }
  .corner.tr { top: 40px; right: 64px; clip-path: inset(0 0 0 100%); }
  .corner.bl { bottom: 40px; left: 64px; }
  .corner.br { bottom: 40px; right: 64px; color: #E60012; clip-path: inset(0 0 0 100%); }

  /* === LAYER 5: Horizontal rules that frame the wordmark === */
  .rule { position: absolute; left: 50%; height: 1px; background: rgba(255,255,255,0.12); transform: translateX(-50%); }
  .rule.top-rule { top: 35%; width: 0; }
  .rule.bot-rule { top: 65%; width: 0; }

  /* === LAYER 6: Red accent dots at intersection points === */
  .dot { position: absolute; width: 8px; height: 8px; background: #E60012; border-radius: 50%; transform: scale(0); }
  .dot.d1 { top: 35%; left: 50%; transform-origin: center; }
  .dot.d2 { top: 65%; left: 50%; transform-origin: center; }

  /* === LAYER 7: Bottom hint — sliding counter-reveal === */
  .hint {
    position: absolute; right: 80px; bottom: 130px;
    display: flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.5);
    clip-path: inset(0 0 0 100%);
  }
  .hint .bar { width: 50px; height: 1px; background: #E60012; }
  .hint .red { color: #E60012; }

  /* === LAYER 8: Vignette === */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.4) 100%);
    pointer-events: none; opacity: 0;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="cover_blackred" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="vignette"></div>
      <div class="red-line"></div>
      <div class="rule top-rule"></div>
      <div class="rule bot-rule"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>

      <div class="corner tl">VICOO · SS26</div>
      <div class="corner tr">CAMPAIGN FILM</div>
      <div class="corner bl">UNIQLO × VICOO</div>
      <div class="corner br">2026</div>

      <div class="wordmark">
        <div class="word" id="theWord">
          <span class="letter">V</span><span class="letter">I</span><span class="letter">C</span><span class="letter">O</span><span class="letter">O</span>
        </div>
      </div>

      <div class="tagline" id="theTagline"></div>

      <div class="hint">
        <span class="bar"></span>
        <span>ENTER THE <span class="red">STORE</span> →</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["cover_blackred"] = tl;

      // Setup
      gsap.set('.vignette', { opacity: 0 });
      gsap.set('.red-line', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.rule', { width: 0 });
      gsap.set('.dot', { scale: 0 });
      gsap.set('.corner', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set('.corner.tr, .corner.br', { clipPath: 'inset(0 0 0 100%)' });
      gsap.set('.wordmark .word', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set('.letter', { opacity: 0, rotationX: -90, transformOrigin: 'center bottom' });
      gsap.set('.hint', { clipPath: 'inset(0 0 0 100%)' });

      // Prepare tagline as individual characters
      const taglineText = 'MADE TO CIRCULATE';
      const taglineEl = document.getElementById('theTagline');
      taglineEl.innerHTML = taglineText.split('').map(c =>
        c === ' ' ? ' ' : '<span class="char">' + c + '</span>'
      ).join('');

      // === ACT 1: Black void — hold tension (0-0.4s) ===
      // Nothing happens. Pure black. The audience waits.

      // === ACT 2: The red line slashes across (0.4-0.8s) ===
      tl.to('.red-line', {
        scaleX: 1, duration: 0.35, ease: 'power4.in'
      }, 0.4);
      // Line glows brighter at peak
      tl.to('.red-line', {
        boxShadow: '0 0 60px rgba(230,0,18,0.9)', duration: 0.15, ease: 'power2.out'
      }, 0.75);
      tl.to('.red-line', {
        boxShadow: '0 0 30px rgba(230,0,18,0.6)', duration: 0.3, ease: 'power2.in'
      }, 0.9);

      // === ACT 3: Wordmark revealed by clipPath wipe (0.6-1.4s) ===
      tl.to('.wordmark .word', {
        clipPath: 'inset(0 0% 0 0)', duration: 0.7, ease: 'power3.inOut'
      }, 0.6);

      // Each letter does a subtle 3D rotation as it appears
      tl.to('.letter', {
        opacity: 1, rotationX: 0, duration: 0.4,
        stagger: { each: 0.06, from: 'start' },
        ease: 'back.out(1.2)'
      }, 0.7);

      // === ACT 4: Horizontal rules extend from center (1.2-1.8s) ===
      tl.to('.rule.top-rule', { width: 600, duration: 0.5, ease: 'power3.out' }, 1.2);
      tl.to('.rule.bot-rule', { width: 600, duration: 0.5, ease: 'power3.out' }, 1.3);

      // Dots pop at intersection
      tl.to('.dot.d1', { scale: 1, duration: 0.3, ease: 'back.out(3)' }, 1.5);
      tl.to('.dot.d2', { scale: 1, duration: 0.3, ease: 'back.out(3)' }, 1.6);

      // === ACT 5: Corner text — clipPath reveal from their edge (1.4-2.0s) ===
      tl.to('.corner.tl', { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 1.4);
      tl.to('.corner.bl', { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 1.5);
      tl.to('.corner.tr', { clipPath: 'inset(0 0 0 0%)', duration: 0.4, ease: 'power2.out' }, 1.6);
      tl.to('.corner.br', { clipPath: 'inset(0 0 0 0%)', duration: 0.4, ease: 'power2.out' }, 1.7);

      // === ACT 6: Tagline typed character by character (1.8-3.0s) ===
      tl.to('.tagline .char', {
        opacity: 1, duration: 0.05,
        stagger: { each: 0.06, from: 'start' },
        ease: 'none'
      }, 1.8);

      // === ACT 7: Vignette fades in subtly (2.5s) ===
      tl.to('.vignette', { opacity: 1, duration: 1.0, ease: 'power1.in' }, 2.5);

      // === ACT 8: Hint reveals via clipPath (3.0-3.4s) ===
      tl.to('.hint', { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'power2.inOut' }, 3.0);

      // === EXIT: Everything dissolves into black ===
      tl.to('.hint', { clipPath: 'inset(0 0 0 100%)', duration: 0.3, ease: 'power2.in' }, 4.2);
      tl.to('.tagline .char', { opacity: 0, duration: 0.15, stagger: { each: 0.02, from: 'end' }, ease: 'none' }, 4.2);
      tl.to('.corner', { opacity: 0, duration: 0.2 }, 4.3);
      tl.to('.dot', { scale: 0, duration: 0.2, ease: 'power2.in' }, 4.3);
      tl.to('.rule', { width: 0, duration: 0.3, ease: 'power2.in' }, 4.3);
      tl.to('.letter', { opacity: 0, rotationX: 90, duration: 0.3, stagger: { each: 0.03, from: 'end' }, ease: 'power2.in' }, 4.4);
      tl.to('.wordmark .word', { clipPath: 'inset(0 0 0 100%)', duration: 0.4, ease: 'power3.in' }, 4.5);
      tl.to('.red-line', { scaleX: 0, transformOrigin: 'right center', duration: 0.3, ease: 'power2.in' }, 4.6);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
