<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Cart Drawer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }

  .behind { position: absolute; left: 0; right: 0; top: 0; height: 88px; background: #E60012; display: flex; align-items: center; padding: 0 80px; }
  .behind .logo { display: flex; align-items: center; gap: 12px; color: #FFFFFF; }
  .behind .logo .mark { width: 40px; height: 40px; background: #FFFFFF; color: #E60012; display: flex; align-items: center; justify-content: center; font-family: 'Smiley Sans', sans-serif; font-size: 22px; }
  .behind .logo .name { font-family: 'Smiley Sans', sans-serif; font-size: 22px; }

  .dim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 5; }

  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 520px; background: #FFFFFF; z-index: 10; display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,0.15); }
  .drawer .header { padding: 24px 32px; border-bottom: 1px solid #F0F0F0; display: flex; align-items: center; justify-content: space-between; }
  .drawer .header h3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .drawer .header .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888; letter-spacing: 0.1em; }
  .drawer .header .close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }

  .drawer .items { flex: 1; overflow-y: auto; padding: 24px 32px; }
  .drawer .item { display: flex; gap: 16px; padding: 20px 0; border-bottom: 1px solid #F5F5F5; }
  .drawer .item .img { width: 100px; height: 100px; background: #F5F5F5; overflow: hidden; }
  .drawer .item .img img { width: 100%; height: 100%; object-fit: cover; }
  .drawer .item .info { flex: 1; }
  .drawer .item .info .name { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 15px; }
  .drawer .item .info .price { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; color: #1A1A16; margin-top: 8px; }
  .drawer .item .info .qty { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .drawer .item .info .qty .btn { width: 28px; height: 28px; border: 1px solid #E0E0E0; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; }
  .drawer .item .info .qty .num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; }

  .drawer .impact { padding: 20px 32px; background: #F5F0E8; }
  .drawer .impact .text { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: #555; line-height: 1.5; }
  .drawer .impact .text .red { color: #E60012; font-weight: 700; }

  .drawer .footer { padding: 24px 32px; border-top: 1px solid #F0F0F0; }
  .drawer .footer .total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .drawer .footer .total .label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: #888; }
  .drawer .footer .total .price { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 24px; }
  .drawer .footer .btn { width: 100%; padding: 18px; background: #E60012; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; }
  .drawer .footer .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: translateX(-100%); }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="cart" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="behind">
        <div class="logo">
          <div class="mark">V</div>
          <div class="name">VICOO</div>
        </div>
      </div>

      <div class="dim"></div>

      <div class="drawer">
        <div class="header">
          <h3>Shopping Cart</h3>
          <div class="count">3 ITEMS</div>
          <div class="close">✕</div>
        </div>

        <div class="items">
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=200&q=80" alt="" /></div>
            <div class="info">
              <div class="name">春野·儿童画联名T恤</div>
              <div class="price">¥178</div>
              <div class="qty"><div class="btn">-</div><div class="num">1</div><div class="btn">+</div></div>
            </div>
          </div>
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=200&q=80" alt="" /></div>
            <div class="info">
              <div class="name">再生羊毛V领针织衫</div>
              <div class="price">¥329</div>
              <div class="qty"><div class="btn">-</div><div class="num">1</div><div class="btn">+</div></div>
            </div>
          </div>
          <div class="item">
            <div class="img"><img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=200&q=80" alt="" /></div>
            <div class="info">
              <div class="name">轻量保暖外套</div>
              <div class="price">¥499</div>
              <div class="qty"><div class="btn">-</div><div class="num">1</div><div class="btn">+</div></div>
            </div>
          </div>
        </div>

        <div class="impact">
          <div class="text">本订单将向美育基金捐赠 <span class="red">¥77 (12.7%)</span>，支持乡村儿童美术教育。</div>
        </div>

        <div class="footer">
          <div class="total">
            <div class="label">TOTAL</div>
            <div class="price">¥1,006</div>
          </div>
          <button class="btn" disabled><div class="sweep"></div>CHECKOUT →</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["cart"] = tl;

      gsap.set('.behind', { y: -88, opacity: 0 });
      gsap.set('.dim', { opacity: 0 });
      gsap.set('.drawer', { x: 520, opacity: 0 });
      gsap.set('.drawer .header > *', { y: -15, opacity: 0 });
      gsap.set('.drawer .item', { x: 30, opacity: 0 });
      gsap.set('.drawer .impact', { y: 20, opacity: 0 });
      gsap.set('.drawer .footer > *', { y: 20, opacity: 0 });
      gsap.set('.drawer .footer .btn .sweep', { x: '-100%' });

      // Entry
      tl.to('.behind', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0);
      tl.to('.dim', { opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.2);
      tl.to('.drawer', { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.3);

      // Header
      tl.to('.drawer .header > *', { y: 0, opacity: 1, duration: 0.4, stagger: 0.06, ease: 'power3.out' }, 0.5);

      // Items — staggered slide in
      tl.to('.drawer .item', { x: 0, opacity: 1, duration: 0.5, stagger: 0.12, ease: 'power3.out' }, 0.7);

      // Impact message
      tl.to('.drawer .impact', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 1.2);

      // Footer
      tl.to('.drawer .footer > *', { y: 0, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'power3.out' }, 1.4);

      // Button sweep
      tl.to('.drawer .footer .btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.0);

      // Exit
      tl.to('.drawer .footer > *', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.2);
      tl.to('.drawer .impact', { y: -10, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.3);
      tl.to('.drawer .item', { x: 20, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.3);
      tl.to('.drawer', { x: 520, opacity: 0, duration: 0.5, ease: 'power3.in' }, 5.4);
      tl.to('.dim', { opacity: 0, duration: 0.4, ease: 'power2.in' }, 5.5);
      tl.to('.behind', { y: -88, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
