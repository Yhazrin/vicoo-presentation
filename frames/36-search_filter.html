<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Search & Filter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .heading { position: absolute; top: 130px; left: 80px; right: 80px; }
  .heading .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .heading h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 56px; line-height: 0.95; letter-spacing: -2px; color: #1A1A16; margin-top: 8px; }
  .heading h1 em { font-style: normal; color: #E60012; }

  .search-bar { position: absolute; left: 80px; right: 80px; top: 280px; height: 56px; background: #F5F5F5; border: 2px solid #1A1A16; display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .search-bar .icon { font-size: 20px; }
  .search-bar input { flex: 1; font-family: 'Inter', sans-serif; font-size: 16px; color: #1A1A16; border: 0; outline: none; background: transparent; }
  .search-bar .kbd { padding: 4px 10px; background: #1A1A16; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }

  .filters { position: absolute; left: 80px; right: 80px; top: 360px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter { padding: 10px 18px; border: 1px solid #1A1A16; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .filter.active { background: #1A1A16; color: #FFFFFF; }
  .filter .count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; }
  .filter.active .count { color: rgba(255,255,255,0.6); }
  .filter .red { color: #E60012; }
  .filter.active .red { color: #FF6666; }

  .results { position: absolute; left: 80px; right: 80px; top: 440px; bottom: 80px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .result-card { background: #F5F5F5; padding: 16px; display: flex; flex-direction: column; }
  .result-card .img { width: 100%; height: 180px; background: #E0E0E0; margin-bottom: 12px; overflow: hidden; }
  .result-card .img img { width: 100%; height: 100%; object-fit: cover; }
  .result-card .name { font-family: 'Noto Sans SC', sans-serif; font-weight: 700; font-size: 15px; }
  .result-card .price { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; color: #1A1A16; margin-top: 8px; }
  .result-card .price .red { color: #E60012; }
  .result-card .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: #E60012; margin-top: 8px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="search_filter" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">SEARCH</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 10 · /shop</div>
      </div>

      <div class="heading">
        <div class="kicker">CHAPTER 05 · DISCOVER</div>
        <h1>Find the <em>perfect piece</em> for every child.</h1>
      </div>

      <div class="search-bar">
        <div class="icon">🔍</div>
        <input type="text" placeholder="搜索联名款、公益商品、儿童画作..." disabled>
        <div class="kbd">⌘K</div>
      </div>

      <div class="filters">
        <div class="filter active">全部 <span class="count">1,284</span></div>
        <div class="filter">联名款 <span class="count">32</span></div>
        <div class="filter">公益商品 <span class="red">♥</span> <span class="count">156</span></div>
        <div class="filter">有机棉 <span class="count">89</span></div>
        <div class="filter">再生面料 <span class="count">67</span></div>
        <div class="filter">童装 <span class="count">234</span></div>
        <div class="filter">限量 <span class="count">12</span></div>
      </div>

      <div class="results">
        <div class="result-card">
          <div class="img"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=400&q=80" alt=""></div>
          <div class="name">有机棉圆领T恤</div>
          <div class="price">¥159</div>
          <div class="tag">GOTS CERTIFIED</div>
        </div>
        <div class="result-card">
          <div class="img"><img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=400&q=80" alt=""></div>
          <div class="name">再生羊毛V领针织衫</div>
          <div class="price">¥329</div>
          <div class="tag">RECYCLED WOOL</div>
        </div>
        <div class="result-card">
          <div class="img"><img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=400&q=80" alt=""></div>
          <div class="name">轻量保暖外套</div>
          <div class="price">¥499</div>
          <div class="tag">WATER RESISTANT</div>
        </div>
        <div class="result-card">
          <div class="img"><img src="https://images.unsplash.com/photo-1517438476312-10d79c077509?auto=format&fit=crop&w=400&q=80" alt=""></div>
          <div class="name">凉感慢跑裤</div>
          <div class="price">¥199</div>
          <div class="tag">QUICK DRY</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["search_filter"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.heading > *', { y: 20, opacity: 0 });
      gsap.set('.search-bar', { y: 20, opacity: 0 });
      gsap.set('.filter', { y: 15, opacity: 0 });
      gsap.set('.result-card', { y: 30, opacity: 0, scale: 0.95 });

      tl.to('.red-bar', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power2.out' }, 0.1);
      tl.to('.heading > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power2.out' }, 0.3);
      tl.to('.search-bar', { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.6);
      tl.to('.filter', { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: 'power2.out' }, 0.8);
      tl.to('.result-card', { y: 0, opacity: 1, scale: 1, duration: 0.5, stagger: 0.1, ease: 'back.out(1.1)' }, 1.2);

      // Exit
      tl.to('.result-card', { y: -20, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power2.in' }, 4.2);
      tl.to('.filter', { y: -10, opacity: 0, duration: 0.2, ease: 'power2.in' }, 4.4);
      tl.to('.search-bar', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.4);
      tl.to('.heading > *', { y: -15, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power2.in' }, 4.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 4.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
