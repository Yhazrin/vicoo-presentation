<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — 3D Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #FFF; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: rgba(255,255,255,0.3); }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; left: 80px; right: 80px; top: 140px; bottom: 80px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; }

  .left { display: flex; flex-direction: column; justify-content: center; }
  .left .kicker { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #E60012; }
  .left h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 52px; line-height: 1.0; letter-spacing: -2px; color: #FFFFFF; margin-top: 12px; }
  .left h1 em { font-style: normal; color: #E60012; }
  .left .body { font-family: 'Noto Sans SC', sans-serif; font-size: 18px; color: rgba(255,255,255,0.7); margin-top: 24px; line-height: 1.7; max-width: 480px; }

  .stats { display: flex; gap: 24px; margin-top: 32px; }
  .stat { padding: 16px; background: rgba(255,255,255,0.05); text-align: center; flex: 1; }
  .stat .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 28px; color: #E60012; }
  .stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

  .right { position: relative; display: flex; align-items: center; justify-content: center; }
  .globe-container { position: relative; width: 500px; height: 500px; }
  .globe { width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15); position: relative; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.05) 0%, transparent 50%); }
  .globe::before { content: ''; position: absolute; inset: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
  .globe::after { content: ''; position: absolute; inset: 80px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.05); }

  .globe-node { position: absolute; width: 16px; height: 16px; background: #E60012; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 12px rgba(230,0,18,0.5); z-index: 2; }
  .globe-node::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(230,0,18,0.3); animation: pulse-ring 2s ease-out infinite; }
  .globe-node .label { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.7); white-space: nowrap; }

  @keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }

  .globe-arc { position: absolute; border: 1px solid rgba(230,0,18,0.3); border-radius: 50%; }

  .side-timeline { position: absolute; right: -60px; top: 50px; bottom: 50px; width: 2px; background: rgba(255,255,255,0.1); }
  .side-timeline .dot { position: absolute; left: -4px; width: 10px; height: 10px; background: #E60012; border-radius: 50%; }
  .side-timeline .dot::after { content: attr(data-label); position: absolute; left: 16px; top: -4px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.6); white-space: nowrap; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="globe_intro" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">TRACEABILITY</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 11 · /globe</div>
      </div>

      <div class="content">
        <div class="left">
          <div class="kicker">TRACEABILITY · 3D GLOBE</div>
          <h1>See every <em>node</em> in the supply chain.</h1>
          <div class="body">3D 交互式地球，展示从棉花种植到成衣出厂的每一个节点。7 个国家，5 个阶段，每一步都可验证。</div>

          <div class="stats">
            <div class="stat"><div class="val">7</div><div class="lbl">Countries</div></div>
            <div class="stat"><div class="val">5</div><div class="lbl">Stages</div></div>
            <div class="stat"><div class="val">98.7%</div><div class="lbl">Traceable</div></div>
          </div>
        </div>

        <div class="right">
          <div class="globe-container">
            <div class="globe">
              <div class="globe-arc" style="width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
              <div class="globe-arc" style="width: 400px; height: 400px; top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>

              <div class="globe-node" style="top: 35%; left: 65%;"><div class="label">CN · Xinjiang</div></div>
              <div class="globe-node" style="top: 42%; left: 70%;"><div class="label">CN · Shaoxing</div></div>
              <div class="globe-node" style="top: 38%; left: 75%;"><div class="label">CN · Suzhou</div></div>
              <div class="globe-node" style="top: 40%; left: 80%;"><div class="label">CN · Shanghai</div></div>
              <div class="globe-node" style="top: 32%; left: 48%;"><div class="label">TR · Istanbul</div></div>
              <div class="globe-node" style="top: 50%; left: 60%;"><div class="label">IN · Mumbai</div></div>
              <div class="globe-node" style="top: 30%; left: 42%;"><div class="label">FR · Paris</div></div>
            </div>

            <div class="side-timeline">
              <div class="dot" style="top: 10%;" data-label="COTTON"></div>
              <div class="dot" style="top: 30%;" data-label="SPINNING"></div>
              <div class="dot" style="top: 50%;" data-label="DYEING"></div>
              <div class="dot" style="top: 70%;" data-label="CUTTING"></div>
              <div class="dot" style="top: 90%;" data-label="ASSEMBLY"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["globe_intro"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.left .kicker', { y: 20, opacity: 0 });
      gsap.set('.left h1', { y: 30, opacity: 0 });
      gsap.set('.left .body', { y: 20, opacity: 0 });
      gsap.set('.stat', { y: 20, opacity: 0, scale: 0.9 });
      gsap.set('.globe', { scale: 0.5, opacity: 0 });
      gsap.set('.globe-arc', { scale: 0, opacity: 0 });
      gsap.set('.globe-node', { scale: 0, opacity: 0 });
      gsap.set('.side-timeline', { scaleY: 0, transformOrigin: 'top' });
      gsap.set('.side-timeline .dot', { scale: 0, opacity: 0 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 0.1);

      // Left content
      tl.to('.left .kicker', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.3);
      tl.to('.left h1', { y: 0, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0.5);
      tl.to('.left .body', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.8);
      tl.to('.stat', { y: 0, opacity: 1, scale: 1, duration: 0.5, stagger: 0.1, ease: 'back.out(1.4)' }, 1.0);

      // Globe — scale in with bounce
      tl.to('.globe', { scale: 1, opacity: 1, duration: 0.8, ease: 'back.out(1.2)' }, 0.6);

      // Globe arcs
      tl.to('.globe-arc', { scale: 1, opacity: 1, duration: 0.6, stagger: 0.15, ease: 'power3.out' }, 1.0);

      // Globe nodes — staggered pop
      tl.to('.globe-node', { scale: 1, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'back.out(2)' }, 1.4);

      // Side timeline
      tl.to('.side-timeline', { scaleY: 1, duration: 0.6, ease: 'power3.inOut' }, 1.8);
      tl.to('.side-timeline .dot', { scale: 1, opacity: 1, duration: 0.4, stagger: 0.1, ease: 'back.out(1.4)' }, 2.0);

      // Gentle globe rotation
      tl.to('.globe', { rotation: 5, duration: 3.0, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 2.5);

      // Exit
      tl.to('.side-timeline .dot', { scale: 0, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.2);
      tl.to('.side-timeline', { scaleY: 0, duration: 0.3, ease: 'power3.in' }, 5.3);
      tl.to('.globe-node', { scale: 0, opacity: 0, duration: 0.3, stagger: 0.03, ease: 'power3.in' }, 5.2);
      tl.to('.globe', { scale: 0.5, opacity: 0, duration: 0.4, ease: 'power3.in' }, 5.3);
      tl.to('.stat', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.4);
      tl.to('.left .body', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.4);
      tl.to('.left h1', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.left .kicker', { y: -10, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
