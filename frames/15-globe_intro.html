<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — 3D Globe (Three.js)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; overflow: hidden; }

  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: #E60012; transform: scaleX(0); transform-origin: left; z-index: 10; }

  /* Globe canvas fills the right side */
  #globeCanvas { position: absolute; right: 0; top: 0; width: 55%; height: 100%; }

  /* Left content overlay */
  .left { position: absolute; left: 80px; top: 0; width: 420px; height: 100%; display: flex; flex-direction: column; justify-content: center; z-index: 5; }
  .left .kicker { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: #E60012; clip-path: inset(0 100% 0 0); }
  .left h1 { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 48px; line-height: 1.05; letter-spacing: -2px; color: #FFFFFF; margin-top: 16px; clip-path: inset(0 100% 0 0); }
  .left h1 em { font-style: normal; color: #E60012; }
  .left .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 16px; line-height: 1.7; color: rgba(255,255,255,0.6); margin-top: 20px; clip-path: inset(0 100% 0 0); }

  .stats { display: flex; gap: 20px; margin-top: 32px; }
  .stat { padding: 12px 16px; background: rgba(255,255,255,0.05); text-align: center; transform: translateY(15px); opacity: 0; }
  .stat .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; color: #E60012; }
  .stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }

  /* Node labels — positioned by JS */
  .node-labels { position: absolute; right: 0; top: 0; width: 55%; height: 100%; pointer-events: none; z-index: 5; }
  .node-label {
    position: absolute; transform: translate(-50%, -50%);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500;
    color: rgba(255,255,255,0.7); white-space: nowrap; letter-spacing: 0.08em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    opacity: 0; transition: opacity 0.3s;
  }
  .node-label .dot { display: inline-block; width: 6px; height: 6px; background: #E60012; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="globe_intro" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <canvas id="globeCanvas"></canvas>

      <div class="node-labels" id="nodeLabels"></div>

      <div class="left">
        <div class="kicker">TRACEABILITY · 3D GLOBE</div>
        <h1>See every <em>node</em> in the supply chain.</h1>
        <div class="desc">3D 交互式地球，展示从棉花种植到成衣出厂的每一个节点。7 个国家，5 个阶段，每一步都可验证。</div>
        <div class="stats">
          <div class="stat"><div class="val">7</div><div class="lbl">Countries</div></div>
          <div class="stat"><div class="val">5</div><div class="lbl">Stages</div></div>
          <div class="stat"><div class="val">98.7%</div><div class="lbl">Traceable</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="../scripts/vfx-ambient.js"></script>
  <script>
    (function () {
      // ── Supply chain nodes (lat, lng) ──
      const NODES = [
        { lat: 40.5, lng: 80.0, label: 'CN · Xinjiang', stage: '01' },
        { lat: 30.0, lng: 120.6, label: 'CN · Shaoxing', stage: '02' },
        { lat: 31.3, lng: 120.6, label: 'CN · Suzhou', stage: '03' },
        { lat: 31.2, lng: 121.5, label: 'CN · Shanghai', stage: '04' },
        { lat: 41.0, lng: 29.0, label: 'TR · Istanbul', stage: 'S' },
        { lat: 19.1, lng: 72.9, label: 'IN · Mumbai', stage: 'S' },
        { lat: 48.9, lng: 2.3, label: 'FR · Paris', stage: 'S' },
      ];

      const GLOBE_RADIUS = 1.85;
      const latLngToVec3 = (lat, lng, r) => {
        const phi = (90 - lat) * Math.PI / 180;
        const theta = (lng + 180) * Math.PI / 180;
        return new THREE.Vector3(
          -r * Math.sin(phi) * Math.cos(theta),
          r * Math.cos(phi),
          r * Math.sin(phi) * Math.sin(theta)
        );
      };

      // ── Three.js setup ──
      const canvas = document.getElementById('globeCanvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(48, canvas.clientWidth / canvas.clientHeight, 0.05, 100);
      camera.position.set(0, 1.0, 5.0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(canvas.clientWidth, canvas.clientHeight);

      // Lights
      scene.add(new THREE.AmbientLight(0xfff2e6, 0.8));
      const key = new THREE.DirectionalLight(0xffead4, 1.0);
      key.position.set(4, 6, 5);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xa8bdd4, 0.4);
      rim.position.set(-5, 2, -6);
      scene.add(rim);

      // Globe group
      const globe = new THREE.Group();
      globe.rotation.x = 0.3;
      scene.add(globe);

      // Wireframe sphere
      const wireGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 32, 24);
      const wireMat = new THREE.MeshBasicMaterial({ color: 0xD4CFC4, wireframe: true, transparent: true, opacity: 0.3 });
      globe.add(new THREE.Mesh(wireGeo, wireMat));

      // Ocean sphere
      const oceanGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 0.998, 48, 36);
      const oceanMat = new THREE.MeshBasicMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.4 });
      globe.add(new THREE.Mesh(oceanGeo, oceanGeo));

      // Grid lines
      const gridMat = new THREE.LineBasicMaterial({ color: 0xD4CFC4, transparent: true, opacity: 0.1 });
      for (let lat = -60; lat <= 60; lat += 30) {
        const pts = [];
        for (let lng = -180; lng <= 180; lng += 5) pts.push(latLngToVec3(lat, lng, GLOBE_RADIUS));
        globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }
      for (let lng = -180; lng < 180; lng += 30) {
        const pts = [];
        for (let lat = -90; lat <= 90; lat += 5) pts.push(latLngToVec3(lat, lng, GLOBE_RADIUS));
        globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
      }

      // Markers
      const markerGeo = new THREE.SphereGeometry(0.07, 16, 16);
      const markers = [];
      NODES.forEach((n, i) => {
        const mat = new THREE.MeshStandardMaterial({ color: 0x3F4F45, emissive: 0x1A1A16, emissiveIntensity: 0.15, roughness: 0.45 });
        const m = new THREE.Mesh(markerGeo, mat);
        m.position.copy(latLngToVec3(n.lat, n.lng, GLOBE_RADIUS + 0.04 + i * 0.015));
        globe.add(m);
        markers.push(m);
      });

      // Arc tubes between consecutive Chinese nodes
      const arcMat = new THREE.MeshBasicMaterial({ color: 0x8B3A2A, transparent: true, opacity: 0.5 });
      const arcTubes = [];
      for (let i = 0; i < 4; i++) {
        const a = latLngToVec3(NODES[i].lat, NODES[i].lng, GLOBE_RADIUS + 0.03);
        const b = latLngToVec3(NODES[i+1].lat, NODES[i+1].lng, GLOBE_RADIUS + 0.03);
        const mid = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(GLOBE_RADIUS + 0.3);
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
        const tube = new THREE.TubeGeometry(curve, 32, 0.008, 6, false);
        globe.add(new THREE.Mesh(tube, arcMat));
        arcTubes.push(tube);

        // Arrow cone
        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.1, 8), arcMat.clone());
        cone.position.copy(curve.getPoint(0.95));
        const tan = curve.getTangent(0.95).normalize();
        cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
        globe.add(cone);
      }

      // Moving arrows along arcs
      const runners = [];
      for (let i = 0; i < 4; i++) {
        const a = latLngToVec3(NODES[i].lat, NODES[i].lng, GLOBE_RADIUS + 0.03);
        const b = latLngToVec3(NODES[i+1].lat, NODES[i+1].lng, GLOBE_RADIUS + 0.03);
        const mid = a.clone().add(b).multiplyScalar(0.5).normalize().multiplyScalar(GLOBE_RADIUS + 0.3);
        const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
        const arrow = new THREE.Mesh(
          new THREE.ConeGeometry(0.035, 0.08, 8),
          new THREE.MeshBasicMaterial({ color: 0xE60012, transparent: true, opacity: 0.9 })
        );
        globe.add(arrow);
        runners.push({ curve, arrow, t: 0, speed: 0.008 + i * 0.002 });
      }

      // ── GSAP timeline ──
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["globe_intro"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left' });
      gsap.set('.left .kicker', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set('.left h1', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set('.left .desc', { clipPath: 'inset(0 100% 0 0)' });
      gsap.set('.stat', { y: 15, opacity: 0 });

      // Globe starts invisible
      globe.visible = false;
      markers.forEach(m => m.scale.setScalar(0));
      arcMat.opacity = 0;

      tl.to('.red-bar', { scaleX: 1, duration: 0.25, ease: 'power4.in' }, 0);

      // Globe appears
      tl.call(() => { globe.visible = true; }, null, 0.3);
      tl.to({ v: 0 }, { v: 1, duration: 0.8, ease: 'power2.out',
        onUpdate: function() { globe.scale.setScalar(this.targets()[0].v); }
      }, 0.3);

      // Markers pop
      markers.forEach((m, i) => {
        tl.to(m.scale, { x: 1, y: 1, z: 1, duration: 0.4, ease: 'back.out(2.5)' }, 0.8 + i * 0.12);
      });

      // Arcs fade in
      tl.to(arcMat, { opacity: 0.5, duration: 0.6, ease: 'power2.out' }, 1.2);

      // Left content
      tl.to('.left .kicker', { clipPath: 'inset(0 0% 0 0)', duration: 0.35, ease: 'power2.out' }, 1.0);
      tl.to('.left h1', { clipPath: 'inset(0 0% 0 0)', duration: 0.5, ease: 'power3.inOut' }, 1.2);
      tl.to('.left .desc', { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 1.5);
      tl.to('.stat', { y: 0, opacity: 1, duration: 0.3, stagger: 0.08, ease: 'power2.out' }, 1.8);

      // ── Animation loop ──
      let time = 0;
      function animate() {
        requestAnimationFrame(animate);
        time++;

        // Auto-rotate
        globe.rotation.y += 0.003;

        // Runners move along arcs
        runners.forEach(r => {
          r.t += r.speed;
          if (r.t > 1) r.t -= 0;
          const p = r.curve.getPoint(r.t);
          const tan = r.curve.getTangent(r.t).normalize();
          r.arrow.position.copy(p);
          r.arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
          r.arrow.material.opacity = 0.6 + Math.sin(time * 0.04 + r.t * Math.PI * 2) * 0.35;
        });

        // Markers breathe
        markers.forEach((m, i) => {
          const breath = Math.sin(time * 0.03 + i * 0.8) * 0.08;
          if (m.scale.x > 0.5) m.scale.setScalar(1 + breath);
        });

        renderer.render(scene, camera);
      }
      animate();

      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = canvas.clientWidth / canvas.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
      });

      // === Parallax depth on left content ===
      const leftPanel = document.querySelector('.left');
      if (leftPanel) {
        const kickEl = leftPanel.querySelector('.kicker');
        const h1El = leftPanel.querySelector('h1');
        const descEl = leftPanel.querySelector('.desc');
        const statsEl = leftPanel.querySelector('.stats');
        if (kickEl && h1El && descEl && statsEl) {
          VICOO_VFX.parallaxLayers(document.querySelector('.page'), [
            { el: kickEl, depth: 0.3 },
            { el: h1El, depth: 0.5 },
            { el: descEl, depth: 0.7 },
            { el: statsEl, depth: 0.9 },
          ]);
        }
      }

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
