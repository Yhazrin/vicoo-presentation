<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — 4 Missions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #E60012; margin-bottom: 16px; }
  .headline { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.0; letter-spacing: -2px; color: #1A1A16; text-align: center; margin-bottom: 60px; }
  .headline em { font-style: normal; color: #E60012; }

  .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; max-width: 1400px; }
  .pillar { padding: 32px; background: #F5F5F5; text-align: center; position: relative; overflow: hidden; }
  .pillar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #E60012; transform: scaleX(0); transform-origin: left; }
  .pillar .icon { font-size: 48px; margin-bottom: 16px; }
  .pillar h3 { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; }
  .pillar .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: #666; margin-top: 12px; line-height: 1.5; }
  .pillar .sweep { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(230,0,18,0.1) 0%, transparent 50%); opacity: 0; }
  .pillar .num { position: absolute; top: 16px; right: 16px; font-family: 'Smiley Sans', sans-serif; font-size: 64px; color: rgba(230,0,18,0.1); line-height: 1; }

  .divider { width: 80px; height: 2px; background: rgba(230,0,18,0.3); margin-top: 48px; }
  .closing { font-family: 'Noto Sans SC', sans-serif; font-size: 20px; color: #888; margin-top: 24px; text-align: center; }
  .closing em { font-style: normal; color: #E60012; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="missions" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="content">
        <div class="eyebrow">THE FOUR PILLARS</div>
        <div class="headline">What <em>VICOO</em> stands for.</div>

        <div class="pillars">
          <div class="pillar">
            <div class="num">01</div>
            <div class="sweep"></div>
            <div class="icon">🎨</div>
            <h3>Creative</h3>
            <div class="desc">每个孩子的画作都是一次视觉表达，值得被看见和珍视。</div>
          </div>
          <div class="pillar">
            <div class="num">02</div>
            <div class="sweep"></div>
            <div class="icon">🔍</div>
            <h3>Traceable</h3>
            <div class="desc">从棉田到衣橱，每一步生产都可追溯、可验证。</div>
          </div>
          <div class="pillar">
            <div class="num">03</div>
            <div class="sweep"></div>
            <div class="icon">♻️</div>
            <h3>Circular</h3>
            <div class="desc">衣物回收、再生、再投资，让时尚真正可持续。</div>
          </div>
          <div class="pillar">
            <div class="num">04</div>
            <div class="sweep"></div>
            <div class="icon">💝</div>
            <h3>Charitable</h3>
            <div class="desc">28% 销售额直接捐赠，支持乡村儿童美育教育。</div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="closing">从<em>创意</em>到<em>循环</em>，从<em>可追溯</em>到<em>公益</em>——VICOO 的四个支柱，支撑起一个更好的未来。</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["missions"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.eyebrow', { y: -20, opacity: 0 });
      gsap.set('.headline', { y: 30, opacity: 0 });
      gsap.set('.pillar', { y: 40, opacity: 0, scale: 0.9 });
      gsap.set('.pillar::before', { scaleX: 0 });
      gsap.set('.pillar .sweep', { opacity: 0 });
      gsap.set('.divider', { scaleX: 0, transformOrigin: 'center' });
      gsap.set('.closing', { y: 20, opacity: 0 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.eyebrow', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.2);
      tl.to('.headline', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.4);

      // Pillars — staggered pop with scale
      tl.to('.pillar', { y: 0, opacity: 1, scale: 1, duration: 0.6, stagger: 0.12, ease: 'back.out(1.4)' }, 0.8);

      // Top bar wipe on each pillar
      tl.to('.pillar::before', { scaleX: 1, duration: 0.4, stagger: 0.1, ease: 'power3.inOut' }, 1.2);

      // Sweep effect on pillars
      tl.to('.pillar .sweep', { opacity: 1, duration: 0.5, stagger: 0.1, ease: 'power2.out' }, 1.5);

      // Divider
      tl.to('.divider', { scaleX: 1, duration: 0.5, ease: 'power3.inOut' }, 2.0);

      // Closing
      tl.to('.closing', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 2.2);

      // Exit
      tl.to('.closing', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.2);
      tl.to('.divider', { scaleX: 0, duration: 0.2, ease: 'power3.in' }, 5.3);
      tl.to('.pillar', { y: -30, opacity: 0, duration: 0.3, stagger: 0.05, ease: 'power3.in' }, 5.3);
      tl.to('.headline', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.eyebrow', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
