<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Donation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #0A0A0A; color: #FFFFFF; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }

  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px; }

  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #E60012; margin-bottom: 16px; }
  .headline { font-family: 'Smiley Sans', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.0; letter-spacing: -2px; color: #FFFFFF; text-align: center; margin-bottom: 48px; }
  .headline .red { color: #E60012; }

  .donation-form { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 1200px; }

  .left { display: flex; flex-direction: column; gap: 24px; }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .amount { padding: 16px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
  .amount.active { border-color: #E60012; background: rgba(230,0,18,0.1); }
  .amount .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; }
  .amount .impact { font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .amount .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,0,18,0.2), transparent); transform: translateX(-100%); }

  .custom { padding: 16px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; gap: 12px; }
  .custom .label { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; }
  .custom input { flex: 1; background: transparent; border: 0; color: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; outline: none; }

  .btn { padding: 18px; background: #E60012; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; position: relative; overflow: hidden; }
  .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: translateX(-100%); }

  .right { display: flex; flex-direction: column; gap: 20px; }
  .impact-preview { padding: 24px; background: rgba(255,255,255,0.05); border-left: 3px solid #E60012; }
  .impact-preview .title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .impact-preview .desc { font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: rgba(255,255,255,0.7); margin-top: 12px; line-height: 1.6; }
  .impact-preview .desc .red { color: #E60012; font-weight: 700; }

  .progress-bar { margin-top: 20px; }
  .progress-bar .bar { height: 8px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .progress-bar .fill { height: 100%; background: #E60012; width: 0; }
  .progress-bar .labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .progress-bar .labels span { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #888; }

  .stats { display: flex; gap: 16px; }
  .stat { flex: 1; padding: 16px; background: rgba(255,255,255,0.05); text-align: center; }
  .stat .val { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; color: #E60012; }
  .stat .lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #888; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="donation_panel" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <div class="red-bar"></div>

      <div class="content">
        <div class="eyebrow">MAKE A DONATION</div>
        <div class="headline">Every <span class="red">¥100</span> creates real impact.</div>

        <div class="donation-form">
          <div class="left">
            <div class="amounts">
              <div class="amount">
                <div class="sweep"></div>
                <div class="val">¥50</div>
                <div class="impact">1 套画笔</div>
              </div>
              <div class="amount active">
                <div class="sweep"></div>
                <div class="val">¥100</div>
                <div class="impact">1 名学生 · 1 学期</div>
              </div>
              <div class="amount">
                <div class="sweep"></div>
                <div class="val">¥200</div>
                <div class="impact">1 间画室改造</div>
              </div>
              <div class="amount">
                <div class="sweep"></div>
                <div class="val">¥500</div>
                <div class="impact">1 位教师月薪</div>
              </div>
              <div class="amount">
                <div class="sweep"></div>
                <div class="val">¥1000</div>
                <div class="impact">1 所学校全年画材</div>
              </div>
              <div class="amount">
                <div class="sweep"></div>
                <div class="val">¥5000</div>
                <div class="impact">1 间完整画室</div>
              </div>
            </div>

            <div class="custom">
              <div class="label">CUSTOM AMOUNT</div>
              <input type="text" placeholder="¥" disabled>
            </div>

            <div class="btn"><div class="sweep"></div>DONATE NOW ♥</div>
          </div>

          <div class="right">
            <div class="impact-preview">
              <div class="title">Your ¥100 Impact</div>
              <div class="desc">您的 <span class="red">¥100</span> 将为 1 名乡村学生提供 1 学期的美术用品，包括水彩颜料、画笔、画纸和画板。</div>
            </div>

            <div class="progress-bar">
              <div class="bar"><div class="fill"></div></div>
              <div class="labels"><span>¥1,284,560 raised</span><span>Goal: ¥2,000,000</span></div>
            </div>

            <div class="stats">
              <div class="stat"><div class="val">32</div><div class="lbl">Schools</div></div>
              <div class="stat"><div class="val">4,872</div><div class="lbl">Children</div></div>
              <div class="stat"><div class="val">12,431</div><div class="lbl">Artworks</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["donation_panel"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.eyebrow', { y: -20, opacity: 0 });
      gsap.set('.headline', { y: 30, opacity: 0 });
      gsap.set('.amount', { y: 20, opacity: 0, scale: 0.9 });
      gsap.set('.amount .sweep', { x: '-100%' });
      gsap.set('.custom', { y: 20, opacity: 0 });
      gsap.set('.btn', { y: 20, opacity: 0 });
      gsap.set('.btn .sweep', { x: '-100%' });
      gsap.set('.impact-preview', { x: 30, opacity: 0 });
      gsap.set('.progress-bar .fill', { scaleX: 0, transformOrigin: 'left' });
      gsap.set('.stat', { y: 20, opacity: 0, scale: 0.9 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.eyebrow', { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.2);
      tl.to('.headline', { y: 0, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.4);

      // Amounts — staggered pop
      tl.to('.amount', { y: 0, opacity: 1, scale: 1, duration: 0.4, stagger: 0.06, ease: 'back.out(1.4)' }, 0.8);

      // Amount sweeps
      tl.to('.amount .sweep', { x: '100%', duration: 0.5, stagger: 0.06, ease: 'power2.inOut' }, 1.2);

      // Custom amount
      tl.to('.custom', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 1.5);

      // Button
      tl.to('.btn', { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 1.7);
      tl.to('.btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.0);

      // Impact preview
      tl.to('.impact-preview', { x: 0, opacity: 1, duration: 0.5, ease: 'power3.out' }, 1.5);

      // Progress bar
      tl.to('.progress-bar .fill', { scaleX: 1, duration: 1.0, ease: 'power3.inOut' }, 2.0);

      // Stats
      tl.to('.stat', { y: 0, opacity: 1, scale: 1, duration: 0.4, stagger: 0.08, ease: 'back.out(1.4)' }, 2.5);

      // Exit
      tl.to('.stat', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.2);
      tl.to('.impact-preview', { x: 20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.3);
      tl.to('.btn', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.3);
      tl.to('.custom', { y: -10, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.4);
      tl.to('.amount', { y: -15, opacity: 0, duration: 0.3, stagger: 0.03, ease: 'power3.in' }, 4.4);
      tl.to('.headline', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.5);
      tl.to('.eyebrow', { y: -15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 4.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 4.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
