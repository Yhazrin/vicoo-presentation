<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Normal Product Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; left: 80px; right: 80px; top: 140px; bottom: 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }

  .left { position: relative; overflow: hidden; }
  .left .img { width: 100%; height: 100%; background: #F5F5F5; display: flex; align-items: center; justify-content: center; position: relative; }
  .left .img img { width: 90%; height: 90%; object-fit: cover; }
  .left .img .shine { position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%); transform: translateX(-100%); pointer-events: none; }
  .left .badge { position: absolute; top: 24px; right: 24px; background: #1A1A16; color: #FFFFFF; padding: 10px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; }

  .right { display: flex; flex-direction: column; }
  .right .crumbs { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #888; }
  .right .crumbs .red { color: #E60012; }
  .right h1 { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 48px; line-height: 1.05; letter-spacing: -2px; margin-top: 16px; }
  .right .by { font-family: 'Inter', sans-serif; font-size: 15px; color: #555; margin-top: 12px; }
  .right .by strong { color: #1A1A16; font-weight: 700; }

  .right .price-block { display: flex; align-items: flex-end; gap: 16px; margin-top: 24px; }
  .right .price-block .val { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 72px; line-height: 1; letter-spacing: -3px; }
  .right .price-block .strike { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 20px; color: #999; text-decoration: line-through; padding-bottom: 8px; }

  .right .meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-top: 12px; }
  .right .meta .red { color: #E60012; font-weight: 700; }

  .right .size { margin-top: 24px; }
  .right .size .lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; margin-bottom: 12px; }
  .right .size .row { display: flex; gap: 10px; }
  .right .size .chip { width: 60px; height: 60px; border: 2px solid #1A1A16; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; }
  .right .size .chip.selected { background: #1A1A16; color: #FFFFFF; }

  .right .cta { display: flex; gap: 16px; margin-top: 24px; }
  .right .cta .btn { flex: 1; height: 60px; background: #1A1A16; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase; position: relative; overflow: hidden; }
  .right .cta .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,0,18,0.3), transparent); transform: translateX(-100%); }
  .right .cta .btn-heart { width: 60px; height: 60px; background: #F5F5F5; border: 2px solid #1A1A16; font-size: 24px; display: flex; align-items: center; justify-content: center; }

  .right .reviews { margin-top: 24px; padding-top: 20px; border-top: 1px solid #EEE; }
  .right .reviews .header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .right .reviews .header .stars { color: #FFD700; font-size: 18px; }
  .right .reviews .header .score { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .right .reviews .header .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888; }
  .right .reviews .review { padding: 12px; background: #F5F5F5; margin-bottom: 8px; }
  .right .reviews .review .text { font-family: 'Noto Sans SC', sans-serif; font-size: 13px; color: #555; line-height: 1.5; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="normal_detail" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">SHOP</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 10 · /shop/159</div>
      </div>

      <div class="content">
        <div class="left">
          <div class="img">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=1200&q=85" alt="" />
            <div class="shine"></div>
          </div>
          <div class="badge">GOTS CERTIFIED</div>
        </div>

        <div class="right">
          <div class="crumbs">SHOP / <span class="red">T-SHIRTS</span></div>
          <h1>有机棉圆领T恤</h1>
          <div class="by">by <strong>VICOO</strong> · GOTS 认证有机棉</div>

          <div class="price-block">
            <div class="val">¥159</div>
            <div class="strike">¥219</div>
          </div>
          <div class="meta">SALE · <span class="red">SAVE ¥60 (27%)</span></div>

          <div class="size">
            <div class="lbl">SELECT SIZE</div>
            <div class="row">
              <div class="chip">S</div>
              <div class="chip selected">M</div>
              <div class="chip">L</div>
              <div class="chip">XL</div>
            </div>
          </div>

          <div class="cta">
            <div class="btn"><div class="sweep"></div>ADD TO CART →</div>
            <div class="btn-heart">♡</div>
          </div>

          <div class="reviews">
            <div class="header">
              <div class="stars">★★★★★</div>
              <div class="score">4.8</div>
              <div class="count">(1,284 reviews)</div>
            </div>
            <div class="review"><div class="text">「面料非常柔软，能通过溯源看到每一步生产过程，给孩子买很放心。」</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["normal_detail"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.left .img', { clipPath: 'inset(0 100% 0 0)', opacity: 0 });
      gsap.set('.left .img img', { scale: 1.15, opacity: 0 });
      gsap.set('.left .img .shine', { x: '-100%' });
      gsap.set('.left .badge', { scale: 0, rotation: -45 });
      gsap.set('.right > *', { y: 20, opacity: 0 });
      gsap.set('.right .size .chip', { y: 15, opacity: 0, scale: 0.9 });
      gsap.set('.right .cta .btn .sweep', { x: '-100%' });
      gsap.set('.right .reviews .review', { x: 20, opacity: 0 });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 0.1);

      // Image — clipPath reveal
      tl.to('.left .img', { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 1.0, ease: 'power3.inOut' }, 0.3);
      tl.to('.left .img img', { scale: 1, opacity: 1, duration: 1.2, ease: 'power2.out' }, 0.4);
      tl.to('.left .img .shine', { x: '100%', duration: 0.8, ease: 'power2.inOut' }, 1.0);
      tl.to('.left .badge', { scale: 1, rotation: 0, duration: 0.5, ease: 'back.out(2)' }, 1.2);

      // Right content
      tl.to('.right > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 0.5);

      // Size chips
      tl.to('.right .size .chip', { y: 0, opacity: 1, scale: 1, duration: 0.4, stagger: 0.06, ease: 'back.out(1.4)' }, 1.5);

      // Button sweep
      tl.to('.right .cta .btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.5);

      // Reviews
      tl.to('.right .reviews .review', { x: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 2.8);

      // Exit
      tl.to('.right .reviews .review', { x: 15, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.2);
      tl.to('.right > *', { y: -15, opacity: 0, duration: 0.3, stagger: 0.04, ease: 'power3.in' }, 5.3);
      tl.to('.left .img', { clipPath: 'inset(0 0 0 100%)', opacity: 0, duration: 0.5, ease: 'power3.in' }, 5.4);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
