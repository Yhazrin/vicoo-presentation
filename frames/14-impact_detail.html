<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>VICOO — Impact Product Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Smiley Sans'; src: url('SmileySans-Oblique.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #FFFFFF; color: #1A1A16; font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform: scale(1.3333333); transform-origin: top left; }
  .page { position: absolute; inset: 0; }
  .red-bar { position: absolute; top: 0; left: 0; right: 0; height: 8px; background: #E60012; }
  .top { position: absolute; top: 60px; left: 80px; right: 80px; display: flex; align-items: center; gap: 24px; }
  .top .lbl { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; }
  .top .lbl .red { color: #E60012; }
  .top .rule { flex: 1; height: 1px; background: #1A1A16; }
  .top .meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: #888; }

  .content { position: absolute; left: 80px; right: 80px; top: 140px; bottom: 80px; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; }

  .left { position: relative; overflow: hidden; }
  .left .img { width: 100%; height: 100%; background: #F5F0E8; display: flex; align-items: center; justify-content: center; position: relative; }
  .left .img img { width: 90%; height: 90%; object-fit: cover; }
  .left .img .shine { position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.4) 50%, transparent 70%); transform: translateX(-100%); pointer-events: none; }
  .left .badge { position: absolute; top: 24px; right: 24px; background: #E60012; color: #FFFFFF; padding: 10px 16px; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; }
  .left .badge .small { display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.8; }

  .right { display: flex; flex-direction: column; }
  .right .crumbs { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: #888; }
  .right .crumbs .red { color: #E60012; }
  .right h1 { font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 42px; line-height: 1.05; letter-spacing: -2px; margin-top: 16px; }
  .right .by { font-family: 'Inter', sans-serif; font-size: 15px; color: #555; margin-top: 12px; }
  .right .by strong { color: #1A1A16; font-weight: 700; }
  .right .by .red { color: #E60012; font-weight: 700; }

  .right .price-block { display: flex; align-items: flex-end; gap: 16px; margin-top: 20px; }
  .right .price-block .val { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 64px; line-height: 1; letter-spacing: -3px; }
  .right .price-block .strike { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 18px; color: #999; text-decoration: line-through; padding-bottom: 8px; }
  .right .price-block .donate { padding: 6px 12px; background: #E60012; color: #FFFFFF; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; margin-bottom: 8px; }

  .right .supply-chain { margin-top: 20px; }
  .right .supply-chain .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-bottom: 12px; }
  .right .supply-chain .stages { display: flex; gap: 8px; }
  .right .supply-chain .stage { flex: 1; padding: 10px; background: #F5F5F5; text-align: center; position: relative; overflow: hidden; }
  .right .supply-chain .stage .num { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; color: #E60012; }
  .right .supply-chain .stage .name { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #888; margin-top: 4px; letter-spacing: 0.1em; text-transform: uppercase; }
  .right .supply-chain .stage .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(230,0,18,0.2), transparent); transform: translateX(-100%); }

  .right .cta { display: flex; gap: 16px; margin-top: 20px; }
  .right .cta .btn { flex: 1; height: 56px; background: #E60012; color: #FFFFFF; border: 0; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; position: relative; overflow: hidden; }
  .right .cta .btn .sweep { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transform: translateX(-100%); }

  .right .campaign { margin-top: 20px; padding: 16px; background: #F5F0E8; }
  .right .campaign .name { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; }
  .right .campaign .progress { margin-top: 8px; }
  .right .campaign .progress .bar { height: 6px; background: #E0E0E0; }
  .right .campaign .progress .fill { height: 100%; background: #E60012; }
  .right .campaign .progress .labels { display: flex; justify-content: space-between; margin-top: 6px; }
  .right .campaign .progress .labels span { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #888; }
</style>
</head>
<body>
  <div class="stage">
    <div class="page" data-composition-id="impact_detail" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div class="red-bar"></div>
      <div class="top">
        <div class="lbl">VICOO · <span class="red">IMPACT</span></div>
        <div class="rule"></div>
        <div class="meta">PP. 11 · /impact/shop/178</div>
      </div>

      <div class="content">
        <div class="left">
          <div class="img">
            <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?auto=format&fit=crop&w=1200&q=85" alt="" />
            <div class="shine"></div>
          </div>
          <div class="badge"><span class="small">DONATION</span>28%</div>
        </div>

        <div class="right">
          <div class="crumbs">IMPACT SHOP / <span class="red">CHILDREN'S TEE</span></div>
          <h1>春野·儿童画联名<br/>有机棉T恤</h1>
          <div class="by">Original by <strong>林一一</strong>, age 8 · <span class="red">「春的色彩」美育项目</span></div>

          <div class="price-block">
            <div class="val">¥178</div>
            <div class="strike">¥239</div>
            <div class="donate">28% DONATE</div>
          </div>

          <div class="supply-chain">
            <div class="lbl">5-STAGE SUPPLY CHAIN</div>
            <div class="stages">
              <div class="stage"><div class="sweep"></div><div class="num">01</div><div class="name">Cotton</div></div>
              <div class="stage"><div class="sweep"></div><div class="num">02</div><div class="name">Spin</div></div>
              <div class="stage"><div class="sweep"></div><div class="num">03</div><div class="name">Dye</div></div>
              <div class="stage"><div class="sweep"></div><div class="num">04</div><div class="name">Cut</div></div>
              <div class="stage"><div class="sweep"></div><div class="num">05</div><div class="name">Assemble</div></div>
            </div>
          </div>

          <div class="cta">
            <div class="btn"><div class="sweep"></div>ADD TO CART →</div>
          </div>

          <div class="campaign">
            <div class="name">Campaign: 「春的色彩」</div>
            <div class="progress">
              <div class="bar"><div class="fill" style="width: 40%;"></div></div>
              <div class="labels"><span>200 / 500 件</span><span>40% · 87% ON TRACK</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["impact_detail"] = tl;

      gsap.set('.red-bar', { scaleX: 0, transformOrigin: 'left center' });
      gsap.set('.top > *', { y: -20, opacity: 0 });
      gsap.set('.left .img', { clipPath: 'inset(0 100% 0 0)', opacity: 0 });
      gsap.set('.left .img img', { scale: 1.15, opacity: 0 });
      gsap.set('.left .img .shine', { x: '-100%' });
      gsap.set('.left .badge', { scale: 0, rotation: -45 });
      gsap.set('.right > *', { y: 20, opacity: 0 });
      gsap.set('.right .supply-chain .stage', { y: 15, opacity: 0, scale: 0.9 });
      gsap.set('.right .supply-chain .stage .sweep', { x: '-100%' });
      gsap.set('.right .cta .btn .sweep', { x: '-100%' });
      gsap.set('.right .campaign .progress .fill', { scaleX: 0, transformOrigin: 'left' });

      // Entry
      tl.to('.red-bar', { scaleX: 1, duration: 0.4, ease: 'power4.inOut' }, 0);
      tl.to('.top > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.06, ease: 'power3.out' }, 0.1);

      // Image — clipPath reveal
      tl.to('.left .img', { clipPath: 'inset(0 0% 0 0)', opacity: 1, duration: 1.0, ease: 'power3.inOut' }, 0.3);
      tl.to('.left .img img', { scale: 1, opacity: 1, duration: 1.2, ease: 'power2.out' }, 0.4);
      tl.to('.left .img .shine', { x: '100%', duration: 0.8, ease: 'power2.inOut' }, 1.0);
      tl.to('.left .badge', { scale: 1, rotation: 0, duration: 0.6, ease: 'back.out(2)' }, 1.2);

      // Right content
      tl.to('.right > *', { y: 0, opacity: 1, duration: 0.5, stagger: 0.08, ease: 'power3.out' }, 0.5);

      // Supply chain stages — staggered pop
      tl.to('.right .supply-chain .stage', { y: 0, opacity: 1, scale: 1, duration: 0.4, stagger: 0.08, ease: 'back.out(1.4)' }, 1.5);

      // Stage sweeps
      tl.to('.right .supply-chain .stage .sweep', { x: '100%', duration: 0.5, stagger: 0.08, ease: 'power2.inOut' }, 2.0);

      // Button sweep
      tl.to('.right .cta .btn .sweep', { x: '100%', duration: 0.6, ease: 'power2.inOut' }, 2.5);

      // Campaign progress bar
      tl.to('.right .campaign .progress .fill', { scaleX: 1, duration: 1.0, ease: 'power3.inOut' }, 2.8);

      // Exit
      tl.to('.right > *', { y: -15, opacity: 0, duration: 0.3, stagger: 0.04, ease: 'power3.in' }, 5.2);
      tl.to('.left .img', { clipPath: 'inset(0 0 0 100%)', opacity: 0, duration: 0.5, ease: 'power3.in' }, 5.4);
      tl.to('.top', { y: -20, opacity: 0, duration: 0.3, ease: 'power3.in' }, 5.5);
      tl.to('.red-bar', { scaleX: 0, transformOrigin: 'right center', duration: 0.3 }, 5.5);

      window.addEventListener('load', () => tl.play());
    })();
  </script>
</body>
</html>
